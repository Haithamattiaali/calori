        registry.version.proposed, registry.evaluation.finished, registry.evaluation.cancelled, registry.stage.changed, registry.kill_switch.on,
        registry.kill_switch.off, quotas.version.saved, quotas.version.rolled_back, price.added, spend_cap.saved, spend.alert,
        regression_case.added, regression_case.removed, evaluation_case.viewed, grant_settings.version.saved, audit_trail.queried,
        audit_trail.exported, audit_trail.verified, audit_trail.review_noted, audit_trail.retention_run]
      description: Every Audit trail event name (events.md §2).
    AuditTrailEvent:
      type: object
      description: One Audit trail event (events.md §1). Never holds food names, quantities, calories, media, profile values
        or eater names.
      required: [seq, occurred_at, received_at, actor, action, object, outcome, request_id, surface, prev_hash, hash]
      properties:
        seq: {type: integer, description: Gap-free., minimum: 1}
        occurred_at: {$ref: '#/components/schemas/Instant'}
        received_at: {$ref: '#/components/schemas/Instant'}
        actor: {$ref: '#/components/schemas/AuditActor'}
        action: {$ref: '#/components/schemas/AuditTrailAction'}
        object: {$ref: '#/components/schemas/AuditObject'}
        account_id: {$ref: '#/components/schemas/AccountId'}
        outcome: {$ref: '#/components/schemas/AuditOutcome'}
        code:
          type: string
          enum: [UNIT_NOT_FOUND, UNIT_AMBIGUOUS, STALE_REVISION, SOURCE_BASIS_UNKNOWN, MASS_BALANCE_ERROR, MACROS_INCOMPLETE,
            PLAN_INFEASIBLE, AI_UNAVAILABLE, RATE_LIMITED, VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONSENT_REQUIRED,
            AGE_REQUIREMENT, POLICY_FLOOR, GRANT_REQUIRED, GRANT_NOT_ACTIVE, SERVICE_UNAVAILABLE]
        detail:
          type: object
          description: Allow-listed keys only, per event (events.md §2).
          properties: {}
        request_id: {type: string}
        surface:
          type: string
          enum: [app, console, api, job]
        app_version: {type: string}
        prev_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        hash: {type: string, description: SHA-256(hash(n−1) ‖ canonical(event n))., pattern: '^[0-9a-f]{64}$'}
