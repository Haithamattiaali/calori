        age: {type: integer}
        height_cm: {$ref: '#/components/schemas/ExactNumber'}
        weight_kg: {$ref: '#/components/schemas/ExactNumber'}
        sex_constant:
          type: integer
          enum: [5, -161]
        activity_multiplier: {$ref: '#/components/schemas/Decimal'}
        planned_exercise_kcal: {$ref: '#/components/schemas/ExactNumber'}
        measured_resting_kcal: {$ref: '#/components/schemas/ExactNumber'}
        unrounded_target_kcal: {$ref: '#/components/schemas/ExactNumber'}
    TargetProposals:
      type: object
      description: The proposals the Target screens show; nothing is stored.
      required: [policy_version, resting_energy_kcal, maintenance_kcal, choices, floor_kcal, hard_stop_kcal]
      properties:
        policy_version: {type: integer, minimum: 1}
        resting_energy_kcal: {$ref: '#/components/schemas/ExactNumber'}
        maintenance_kcal: {$ref: '#/components/schemas/ExactNumber'}
        activity_multiplier: {$ref: '#/components/schemas/Decimal'}
        choices:
          type: array
          items: {$ref: '#/components/schemas/TargetChoice'}
        floor_kcal: {$ref: '#/components/schemas/ExactNumber'}
        hard_stop_kcal: {$ref: '#/components/schemas/ExactNumber'}
        macro_split: {$ref: '#/components/schemas/MacroSplit'}
        macro_split_normalised:
          type: object
          description: When the percentages do not add up to 100 (eater-1.35, AT-09).
          properties:
            protein_pct: {$ref: '#/components/schemas/ExactNumber'}
            carbohydrate_pct: {$ref: '#/components/schemas/ExactNumber'}
            fat_pct: {$ref: '#/components/schemas/ExactNumber'}
            shown: {$ref: '#/components/schemas/MacroSplit'}
        macro_targets_g: {$ref: '#/components/schemas/MacroGrams'}
        over_deficit_cap: {type: boolean}
    TargetSource:
      type: string
      enum: [estimated, entered, clinician, suggestion]
      description: Estimated by the app · Entered by you · Clinician-provided · Accepted suggestion (J50, J106).
    TargetVersion:
      type: object
      description: An immutable Target version (E62); past Days keep the version effective that Day.
      required: [target_version_id, source, intake_target_kcal, macro_split, activity_mode, policy_version, effective_from]
      properties:
        target_version_id: {$ref: '#/components/schemas/TargetVersionId'}
        source: {$ref: '#/components/schemas/TargetSource'}
        method: {type: string}
        input_snapshot: {$ref: '#/components/schemas/TargetInputSnapshot'}
        resting_energy_kcal: {$ref: '#/components/schemas/ExactNumber'}
        maintenance_kcal: {$ref: '#/components/schemas/ExactNumber'}
        intake_target_kcal: {$ref: '#/components/schemas/ExactNumber'}
        macro_split: {$ref: '#/components/schemas/MacroSplit'}
        macro_targets_g: {$ref: '#/components/schemas/MacroGrams'}
        macro_locks: {$ref: '#/components/schemas/MacroGrams'}
        activity_mode: {$ref: '#/components/schemas/ActivityMode'}
        credit_factor: {$ref: '#/components/schemas/Decimal'}
        credit_cap_kcal: {$ref: '#/components/schemas/ExactNumber'}
        over_deficit_cap: {type: boolean}
        policy_version: {type: integer, minimum: 1}
        effective_from: {$ref: '#/components/schemas/Instant'}
        effective_to: {$ref: '#/components/schemas/Instant'}
        review_on: {$ref: '#/components/schemas/DiaryDayId'}
        created_at: {$ref: '#/components/schemas/Instant'}
    TargetVersionId:
      type: string
      description: 'A Target version: `tv_<owner>_<n>`.'
      pattern: ^tv_[a-z0-9]+_[0-9]+$
      examples: [tv_mona_2]
    TargetVersionList:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          items: {$ref: '#/components/schemas/TargetVersion'}
          description: Newest first (J105).
    Task:
      type: string
      enum: [meal, label, scale, ingredients, text, voice, explain]
      description: AI tasks Meal · Label · Scale · Ingredients · Text · Voice · Explain (J89).
    TaskAvailability:
      type: object
      required: [task, kill_switch]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        kill_switch: {$ref: '#/components/schemas/KillSwitch'}
    Template:
      type: object
