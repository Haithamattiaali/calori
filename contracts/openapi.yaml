        datasets:
          type: array
          items:
            type: string
            enum: [A400, B1, B2, X, R-gap, chain-40, fresh]
      additionalProperties: false
    TextVersion:
      type: string
      description: A Wording text version (`age-1`, `diary-1`, `c-ai-4`, `health-1`, `mic-1`, `photos-1`, `research-1`, `label-1`,
        `grant-req-1`, `guidance-1`).
      pattern: ^[a-z][a-z-]*-[0-9]+$
      examples: [c-ai-4]
    TierBRecipeRecord:
      type: object
      required: [record_id, version, state, dialect, ingredients, per_100g, licence]
      properties:
        record_id: {$ref: '#/components/schemas/TierBRecipeRecordId'}
        version: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/ReferenceState'}
        dialect: {$ref: '#/components/schemas/Dialect'}
        name_ar: {type: string}
        name_en: {type: string}
        ingredients:
          type: array
          items:
            type: object
            required: [food_id, version, mass_g]
            properties:
              food_id: {$ref: '#/components/schemas/FoodId'}
              version: {type: integer, minimum: 1}
              mass_g: {$ref: '#/components/schemas/ExactNumber'}
        additions:
          type: array
          items:
            type: object
            properties:
              food_id: {$ref: '#/components/schemas/FoodId'}
              version: {type: integer, minimum: 1}
              mass_g: {$ref: '#/components/schemas/ExactNumber'}
        discards:
          type: array
          items:
            type: object
            properties:
              food_id: {$ref: '#/components/schemas/FoodId'}
              version: {type: integer, minimum: 1}
              mass_g: {$ref: '#/components/schemas/ExactNumber'}
        cooked_yield_g: {$ref: '#/components/schemas/ExactNumber', description: 'Weighed (approver-10.33: none → not approvable).'}
        per_100g: {$ref: '#/components/schemas/NutrientVector'}
        assumptions:
          type: array
          items: {type: string}
        licence: {type: string}
        evidence_ids:
          type: array
          items: {type: string}
        cross_checks:
          type: array
          items: {$ref: '#/components/schemas/CrossCheck'}
        infoods_checklist:
          type: object
          description: The INFOODS recipe checklist (approver-10.32).
          properties: {}
        proposed_by: {type: string}
        approved_by: {type: string}
    TierBRecipeRecordId:
      type: string
      description: 'A Tier B recipe record: `rec_<name>_<dialect>`.'
      pattern: ^rec_[a-z0-9_]+$
      examples: [rec_fm_eg]
    TierBRecipeRecordList:
      type: object
      required: [recipes]
      properties:
        recipes:
          type: array
          items: {$ref: '#/components/schemas/TierBRecipeRecord'}
    TimeZone:
      type: string
      description: An IANA time-zone name.
      examples: [Africa/Cairo]
    Totals:
      type: object
      description: Unrounded totals of Confirmed Entries (J113).
      required: [energy_kcal, protein_g, carbohydrate_g, fat_g, macro_coverage_kcal, macros_complete, entry_count]
      properties:
        energy_kcal: {$ref: '#/components/schemas/NutrientValue'}
        protein_g: {$ref: '#/components/schemas/NutrientValue'}
        carbohydrate_g: {$ref: '#/components/schemas/NutrientValue'}
        fat_g: {$ref: '#/components/schemas/NutrientValue'}
        fiber_g: {$ref: '#/components/schemas/NutrientValue'}
        sugars_g: {$ref: '#/components/schemas/NutrientValue'}
        sugar_alcohols_g: {$ref: '#/components/schemas/NutrientValue'}
        macro_coverage_kcal: {$ref: '#/components/schemas/ExactNumber', description: Energy of the Entries whose macros are
            all known.}
        macros_complete: {type: boolean, description: 'True when every counted Entry has protein, carbohydrate and fat.'}
        counts_by_evidence:
          type: object
          description: Entries counted per Evidence badge.
          properties:
            user_defined: {type: integer, minimum: 0}
            estimated_analogue: {type: integer, minimum: 0}
            recipe_calculated: {type: integer, minimum: 0}
            label_verified: {type: integer, minimum: 0}
            measured: {type: integer, minimum: 0}
        entry_count: {type: integer, minimum: 0}
    Unit:
      type: object
      required: [unit_id, name, unit_kind, structure, state, current_version]
