        measured_at: {$ref: '#/components/schemas/Instant'}
        source: {$ref: '#/components/schemas/WeightSource'}
        provider_record_id: {type: string}
        outlier_state:
          type: string
          enum: [unusual, excluded]
          description: '"Unusual — check", or excluded from the trend (never deleted).'
    WeightIn:
      type: object
      required: [command_id, kg, measured_at]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        kg: {$ref: '#/components/schemas/ExactNumber'}
        measured_at: {$ref: '#/components/schemas/Instant'}
      additionalProperties: false
    WeightList:
      type: object
      required: [weights]
      properties:
        weights:
          type: array
          items: {$ref: '#/components/schemas/Weight'}
