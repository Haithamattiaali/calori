      additionalProperties: false
    CommandId:
      type: string
      description: Idempotency key of one command (FRD §18, A5). A UUID made by the device (or the console) once per user
        act and kept with the command in the outbox; a resent command with the same id returns the original answer and writes
        `command.duplicate_ignored`, never a second change. Seed fixture names `cmd_` + 4 hex (seed.md §1) are loaded as `00000000-0000-4000-8000-00000000xxxx`
        (e.g. `cmd_7a1e` → `00000000-0000-4000-8000-000000007a1e`).
      format: uuid
      examples: [00000000-0000-4000-8000-000000007a1e]
    CompletionRecord:
      type: object
      description: 'What a deletion leaves: no identifiers (E15), kept 5 years.'
      required: [deletion_reference, requested_at, completed_at, every_stage_completed, backups_expire_by]
      properties:
        deletion_reference: {$ref: '#/components/schemas/DeletionReference'}
        requested_at: {$ref: '#/components/schemas/Instant'}
        completed_at: {$ref: '#/components/schemas/Instant'}
        every_stage_completed: {type: boolean}
        backups_expire_by: {$ref: '#/components/schemas/Instant'}
    ConfigVersionState:
      type: string
      enum: [in_use, rolled_back]
      description: 'Quotas version: In use · Rolled back (D4).'
    ConfirmedAs:
      type: string
      enum: [ate_as_planned, changed]
      description: How a Plan was confirmed (J50).
    ConsentDecision:
      type: object
      required: [command_id, purpose, decision, text_version, method, made_at]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        purpose: {$ref: '#/components/schemas/Purpose'}
        decision:
          type: string
          enum: [give, withdraw]
        text_version: {$ref: '#/components/schemas/TextVersion', description: The Wording version shown; must be the version
            in force.}
        method: {$ref: '#/components/schemas/ConsentMethod'}
        context: {type: string, description: 'The screen: Capture & Plan, Activity sheet, Unit editor …', maxLength: 60}
        made_at: {$ref: '#/components/schemas/Instant', description: 'Device time (offline: when tapped).'}
        withdrawal_choice:
          type: string
          enum: [keep, delete]
          description: 'Health purposes only: keep or delete what was imported or written (J31).'
      additionalProperties: false
    ConsentDecisionResult:
      type: object
      required: [record]
      properties:
        record: {$ref: '#/components/schemas/ConsentRecord'}
        privacy_job: {$ref: '#/components/schemas/PrivacyJob', description: A withdrawal that starts work (AT-29).}
    ConsentMethod:
      type: string
      enum: [onboarding_age_question, onboarding_switch, onboarding_choice, first_need_sheet, settings_privacy]
      description: How a Consent or the age confirmation was given (J24).
    ConsentRecord:
      type: object
      description: Immutable; the newest record per purpose is in force (E11).
      required: [record_id, purpose, state, text_version, method, made_at, received_at]
      properties:
        record_id: {type: string}
        purpose: {$ref: '#/components/schemas/Purpose'}
        state:
          type: string
          enum: [given, withdrawn]
        text_version: {$ref: '#/components/schemas/TextVersion'}
        method: {$ref: '#/components/schemas/ConsentMethod'}
        context: {type: string}
        made_at: {$ref: '#/components/schemas/Instant'}
        received_at: {$ref: '#/components/schemas/Instant'}
        command_id: {$ref: '#/components/schemas/CommandId'}
    ConsentState:
      type: string
      enum: [not_given, given, withdrawn]
      description: 'Consent: Not given → Given · Withdrawn; Not given is derived from "no record" (J25).'
    ConsentsView:
      type: object
      required: [purposes]
      properties:
        purposes:
          type: array
          items: {$ref: '#/components/schemas/PurposeConsent'}
          minItems: 10
          maxItems: 10
        age_confirmation: {$ref: '#/components/schemas/AgeConfirmation'}
    ConsumeCommand:
      type: object
      description: Commit food actually eaten (FRD §18.1). Nutrients come only from the server-resolved snapshots.
      required: [command_id, intent, diary_day_id, eaten_at, made_at, time_zone, meal_name, items]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        intent:
          type: string
          enum: [consume]
          description: Always `consume` (FRD §18.1).
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId', description: 'The Day the device proposes; the server checks
            it is the Day of `eaten_at` under the boundary in effect then, ±1 Day, and stores it as sent (J115).'}
        eaten_at: {$ref: '#/components/schemas/Instant'}
        made_at: {$ref: '#/components/schemas/Instant', description: 'The device time of the tap that made this command. With
            `source_plan_id` it is compared with the Plan''s `expired_at`: made before → accepted once onto the Plan''s Day,
            even when delivered later (J151); made after → 409 VALIDATION_ERROR `reason: plan_expired` (J149).'}
        time_zone: {$ref: '#/components/schemas/TimeZone'}
        meal_name: {type: string, maxLength: 40}
        expected_day_revision: {type: integer, description: 'Sent by older clients and ignored for consume: additions commute
            (J114).', minimum: 0}
        items:
          type: array
          items: {$ref: '#/components/schemas/ConsumeItem'}
          minItems: 1
          maxItems: 50
        source_plan_id: {$ref: '#/components/schemas/PlanId', description: 'Confirms this Plan in the same transaction (TX-L);
            a confirmation made after the Plan''s `expired_at` is 409 VALIDATION_ERROR `plan_expired` with the Plan''s state
            (J149, eater-5.45); an Infeasible Plan is PLAN_INFEASIBLE.'}
        confirmed_as: {$ref: '#/components/schemas/ConfirmedAs'}
        source_analysis_id: {$ref: '#/components/schemas/AnalysisId', description: Approves this Analysis in the same transaction
            (TX-L).}
      additionalProperties: false
    ConsumeItem:
      type: object
      description: 'One item: a Unit version and a count, or a Food version and grams, or a calorie-only override. The client
        never sends its own nutrient totals (FRD §18.1); an unknown field is VALIDATION_ERROR.'
      properties:
        unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
        count: {$ref: '#/components/schemas/Count'}
        food_version_id: {$ref: '#/components/schemas/FoodVersionId', description: 'A Food logged by typed grams (e.g. "Bread,
            baladi" 80 g, amount declared).'}
        amount_g: {$ref: '#/components/schemas/ExactNumber'}
        user_override:
          type: object
          description: 'Calorie-only custom item: the explicit user-override path; Evidence user-defined (FRD §18.1).'
          required: [name, energy_kcal]
          properties:
            name: {type: string, maxLength: 80}
            energy_kcal: {$ref: '#/components/schemas/ExactNumber'}
          additionalProperties: false
      additionalProperties: false
      oneOf:
      - required: [unit_version_id, count]
      - required: [food_version_id, amount_g]
      - required: [user_override]
    ConsumeResult:
      type: object
      description: Accepted Entries, Meal totals, Day totals and the Day revision (FRD §18).
      required: [diary_day_id, entries, meal_totals, day_totals, day_revision]
      properties:
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        entries:
          type: array
          items: {$ref: '#/components/schemas/Entry'}
          description: The accepted Entries, one per item.
        meal_totals:
          type: array
          items: {$ref: '#/components/schemas/MealTotals'}
          description: The Meal(s) these Entries belong to, after the change.
        day_totals: {$ref: '#/components/schemas/Totals'}
        day_revision: {type: integer, description: The Day's revision after this command (+1 per accepted command)., minimum: 1}
        near_duplicate: {type: boolean, description: 'The same Unit and count were logged within 10 minutes: a quiet note,
            never a block (J118).'}
        replayed: {type: boolean, description: 'True when this `command_id` had already been accepted: the original answer
            is returned and nothing is added (`command.duplicate_ignored`).'}
    CorrectActivity:
      type: object
      required: [command_id, expected_revision]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_revision: {type: integer, minimum: 1}
        start_at: {$ref: '#/components/schemas/Instant'}
        end_at: {$ref: '#/components/schemas/Instant'}
        energy_kcal: {$ref: '#/components/schemas/ExactNumber'}
        energy_basis: {$ref: '#/components/schemas/EnergyBasis'}
        override: {type: boolean}
      additionalProperties: false
    CorrectionCommand:
      type: object
      description: Replace quantity, Unit version, time or Day of one Entry (FRD §18).
      required: [command_id, expected_entry_version, operation]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_entry_version: {type: integer, description: 'The Entry version the correction preview showed; another value
            is 409 STALE_REVISION with `current_revision` (FRD §18 "expected entry version", J114).', minimum: 1}
        operation:
          type: string
          enum: [correct, move]
          description: '`move` keeps the time and changes the Day (FR-041).'
        count: {$ref: '#/components/schemas/Count'}
        amount_g: {$ref: '#/components/schemas/ExactNumber'}
        unit_version_id: {$ref: '#/components/schemas/UnitVersionId', description: Another of the eater's Unit versions; a
            foreign or unknown id is UNIT_NOT_FOUND (J34).}
        eaten_at: {$ref: '#/components/schemas/Instant', description: 'A new time re-assigns the Day with the boundary in
            effect then (J115, J119).'}
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId', description: The Day the preview showed; a mismatch with the
            server's Day assigner is VALIDATION_ERROR `diary_day_id` (J115). Days after the current Day are refused.}
        scope: {$ref: '#/components/schemas/CorrectionScope'}
      additionalProperties: false
    CorrectionResult:
      type: object
      description: old · new · delta and the affected Day projections (FRD §18).
      required: [entry, old, new, delta, affected_days]
      properties:
        entry: {$ref: '#/components/schemas/Entry', description: The new effective Entry version.}
        old: {$ref: '#/components/schemas/EntryValues'}
        new: {$ref: '#/components/schemas/EntryValues'}
        delta: {$ref: '#/components/schemas/NutrientVector', description: 'new − old, unrounded.'}
        affected_days:
          type: array
          items: {$ref: '#/components/schemas/AffectedDay'}
          description: One Day, or two on a move.
          minItems: 1
          maxItems: 2
    CorrectionScope:
      type: string
      enum: [this_entry, future_default]
      description: This Entry only, or also the Unit's default for future logs.
    CostView:
      type: object
      description: Rejected analyses and retries count toward cost (FRD §16.5).
      required: [from, to, total_usd]
      properties:
        from: {$ref: '#/components/schemas/DiaryDayId'}
        to: {$ref: '#/components/schemas/DiaryDayId'}
        total_usd: {$ref: '#/components/schemas/Decimal'}
        per_saved_unit_usd: {$ref: '#/components/schemas/Decimal'}
        per_confirmed_meal_usd: {$ref: '#/components/schemas/Decimal'}
        by_task:
          type: array
          items:
            type: object
            required: [task, estimated_usd]
            properties:
              task: {$ref: '#/components/schemas/Task'}
              estimated_usd: {$ref: '#/components/schemas/Decimal'}
              requests: {type: integer, minimum: 0}
    Count:
      type: string
      description: 'How many of a Unit: a positive exact number as a string — whole by default, halves only when the eater
        allows them (FR-051): `"3"`, `"1/2"`, `"1.5"`.'
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?(/[1-9][0-9]*)?$
      examples: ['3', 1/2]
    CreateAnalysis:
      type: object
      description: Analyze a meal, label, scale, recipe, or text/voice words (FRD §18). Never consumes; nothing from Apple
        Health may be sent (VALIDATION_ERROR).
      required: [command_id, captured_at, diary_day_id]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        mode: {$ref: '#/components/schemas/CaptureMode'}
        intent:
          type: string
          enum: [log, plan, save_unit, correct, unknown]
          description: The eater's choice decides; the analyzer may only suggest (J125).
        words: {type: string, description: 'Typed words, or the transcript the eater saw first.', maxLength: 1000}
        captured_at: {$ref: '#/components/schemas/Instant'}
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId', description: The capture time's Day (J122).}
        language: {$ref: '#/components/schemas/Language'}
        dialect: {$ref: '#/components/schemas/Dialect'}
        retry_of: {$ref: '#/components/schemas/AnalysisId', description: '"Try again" / "Analyse again" make a new Analysis
            naming the old (J66).'}
      additionalProperties: false
    CreateAnalysisUpload:
      type: object
      required: [command]
      properties:
        command: {$ref: '#/components/schemas/CreateAnalysis'}
        photo: {type: string, description: Cropped photo; EXIF stripped on the device and again on the server (FR-077)., contentMediaType: image/jpeg}
        audio: {type: string, description: Voice clip; deleted within 24 h (FR-078)., contentMediaType: audio/mp4}
    CrossCheck:
      type: object
      description: Compared, never copied (approver-10.34).
      required: [source]
      properties:
        source: {type: string}
        energy_kcal: {$ref: '#/components/schemas/NutrientValue'}
        note: {type: string}
    CurrentTarget:
      type: object
      description: The Target version in effect at the request time; `target` absent when none. A newer Policy never rewrites
        it (J107); its credit offer is `GET /v1/targets/activity-credit-offer` (J156).
      required: [review_my_target]
      properties:
        target: {$ref: '#/components/schemas/TargetVersion'}
        review_my_target: {type: boolean, description: A raised floor or hard stop is In effect (J107).}
    DayActivityView:
      type: object
      required: [eligible_kcal, activity_coverage]
      properties:
        active_energy_kcal: {$ref: '#/components/schemas/NutrientValue'}
        eligible_kcal: {$ref: '#/components/schemas/ExactNumber'}
        food_minus_active_kcal: {$ref: '#/components/schemas/NutrientValue'}
        estimated_total_expenditure_kcal: {$ref: '#/components/schemas/NutrientValue'}
        activity_coverage: {$ref: '#/components/schemas/ActivityCoverage'}
    DayMark:
      type: string
      enum: [complete, partial]
      description: The eater's own mark on a Day (FR-073).
    DayProjection:
      type: object
      description: The Day projection (E55), Confirmed totals only.
      required: [diary_day_id, day_revision, state, totals]
      properties:
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        day_revision: {type: integer, minimum: 0}
        state: {$ref: '#/components/schemas/DayState'}
        mark:
          oneOf:
          - {$ref: '#/components/schemas/DayMark'}
          - {type: 'null'}
        started_early: {type: boolean, description: Opened by "Start new day" (J117).}
        boundary_local: {$ref: '#/components/schemas/LocalTime', description: The boundary this Day was built with (J116).}
        time_zone: {$ref: '#/components/schemas/TimeZone'}
        totals: {$ref: '#/components/schemas/Totals'}
    DayReport:
      type: object
      description: Full ledger-backed totals, coverage, Target and provenance of one Day (FRD §18). Confirmed totals only;
        Pending lives on the iPhone (J113).
      required: [diary_day_id, state, day_revision, consumed_kcal, totals, meals, entries]
      properties:
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        state: {$ref: '#/components/schemas/DayState'}
        provisional: {type: boolean}
        day_revision: {type: integer, minimum: 0}
        time_zone: {$ref: '#/components/schemas/TimeZone'}
        boundary_local: {$ref: '#/components/schemas/LocalTime'}
        consumed_kcal: {$ref: '#/components/schemas/ExactNumber', description: Confirmed energy of the Day (= totals.energy_kcal).}
        target_kcal: {$ref: '#/components/schemas/ExactNumber', description: 'The food Target that Day: the Target in Fixed
            mode, base + Activity credit in Activity-adjusted mode (J104). Absent before any Target, in tracking-only mode
            and in Grants (J6).'}
        remaining_kcal: {$ref: '#/components/schemas/ExactNumber', description: target_kcal − consumed_kcal; negative is shown
            as "over". Absent with target_kcal.}
        totals: {$ref: '#/components/schemas/Totals'}
        shares: {$ref: '#/components/schemas/Shares'}
        net_carbohydrate_g: {$ref: '#/components/schemas/NutrientValue'}
        carbohydrate_assessment:
          type: string
          enum: [low, medium, high]
          description: Only when the eater turned carbohydrate labels on (FRD §10.3).
        carbohydrate_label: {type: string, description: The catalogue key of the label shown.}
        meals:
          type: array
          items: {$ref: '#/components/schemas/MealTotals'}
        entries:
          type: array
          items: {$ref: '#/components/schemas/Entry'}
          description: Confirmed effective Entries.
        voided_entries:
          type: array
          items: {$ref: '#/components/schemas/Entry'}
          description: Voided Entries, offered for Restore.
        target: {$ref: '#/components/schemas/DayTargetView', description: Absent before any Target and in tracking-only mode.}
        activity: {$ref: '#/components/schemas/DayActivityView'}
        policy_version: {type: integer, minimum: 1}
    DayState:
      type: string
      enum: [provisional, complete, partial, unlogged]
      description: 'Day: Provisional (today) · Complete · Partial · Unlogged (J138).'
    DayTargetView:
      type: object
      description: The Target version effective on that Day (FR-071).
      required: [target_version_id, intake_target_kcal, activity_mode]
      properties:
        target_version_id: {$ref: '#/components/schemas/TargetVersionId'}
        intake_target_kcal: {$ref: '#/components/schemas/ExactNumber', description: The approved Target (J102).}
        activity_mode: {$ref: '#/components/schemas/ActivityMode'}
        base_kcal: {$ref: '#/components/schemas/ExactNumber', description: 'Activity-adjusted only: the Target without the
            exercise component (J104).'}
        activity_credit_kcal: {$ref: '#/components/schemas/ExactNumber', description: 'Activity-adjusted only: eligible Activity
            × credit_factor, at most credit_cap_kcal.'}
        macro_targets_g:
          type: object
          properties:
            protein_g: {$ref: '#/components/schemas/ExactNumber'}
            carbohydrate_g: {$ref: '#/components/schemas/ExactNumber'}
            fat_g: {$ref: '#/components/schemas/ExactNumber'}
        policy_version: {type: integer, minimum: 1}
        review_my_target: {type: boolean, description: A raised floor or hard stop is In effect since this Target was approved
            (J107).}
    Decimal:
      type: string
      description: 'An exact decimal written as a JSON string: optional minus, digits, optional fraction; no exponent, no
        `+`, no thousands separator, Western digits (J137). Used for money (USD), percentages (`_pct`, 0–100), factors and
        multipliers.'
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
      examples: ['62.5', '0.75', '15']
    DeletionReference:
      type: string
      description: Deletion reference `DEL-yy-mmdd-XXXX` — the only key of a completion record.
      pattern: ^DEL-[0-9]{2}-[0-9]{4}-[A-Z0-9]{4}$
      examples: [DEL-26-0905-P7T2]
    DeviceView:
      type: object
      required: [app_version, last_sync_at]
      properties:
        model_label: {type: string}
        app_version: {type: string}
        os_version: {type: string}
        last_sync_at: {$ref: '#/components/schemas/Instant'}
    Dialect:
      type: string
      enum: [arz, afb, arb]
      description: 'Dialect: EG `arz` · Gulf `afb` · MSA `arb`.'
    DiaryDayId:
      type: string
      description: 'A Day: its local date `YYYY-MM-DD` under the eater''s diary-day boundary (J50, J115).'
      format: date
      examples: ['2026-09-30']
    DomainEventType:
      type: string
      enum: [entry.confirmed, entry.corrected, entry.voided, entry.restored, command.duplicate_ignored, command.conflict,
        day.revised, day.started, day.marked, unit.version.saved, unit.archived, unit.unarchived, template.saved, template.deleted,
        rule.version.saved, analysis.created, analysis.state_changed, analysis.question_answered, plan.proposed, plan.saved,
        plan.confirmed, plan.not_eaten, plan.reopened, plan.expired, activity.import_reconciled, activity.confirmed, activity.corrected,
        activity.linked, activity.voided, activity.restored, weight.recorded, weight.excluded, health.sample_written, health.sample_rewritten,
        health.sample_deleted, target.version.approved, target.suggestion.created, target.suggestion.accepted, target.suggestion.kept,
        safety_mode.set, settings.changed, support_code.issued]
      description: Every domain event name (events.md §3).
    EnergyBasis:
      type: string
      enum: [active, gross]
      description: Energy basis of an Activity (J50); gross is converted before it counts (FR-063).
    Entry:
      type: object
      description: The effective Entry (E54).
      required: [entry_id, entry_version, state, diary_day_id, eaten_at, meal_name, nutrients, evidence]
      properties:
        entry_id: {$ref: '#/components/schemas/EntryId'}
        entry_version: {type: integer, description: 'The Entry''s version; Corrections, Voids and Restores check it (`expected_entry_version`).',
          minimum: 1}
        state: {$ref: '#/components/schemas/EntryState'}
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        eaten_at: {$ref: '#/components/schemas/Instant'}
        time_zone: {$ref: '#/components/schemas/TimeZone'}
        meal_name: {type: string}
        unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
        unit_name: {type: string, description: The Unit's name as the eater wrote it.}
        food_version_id: {$ref: '#/components/schemas/FoodVersionId'}
        count: {$ref: '#/components/schemas/Count'}
        amount_g: {$ref: '#/components/schemas/ExactNumber'}
        nutrients: {$ref: '#/components/schemas/NutrientVector', description: 'count × the snapshot, unrounded.'}
        snapshot: {$ref: '#/components/schemas/EntrySnapshot'}
        evidence: {$ref: '#/components/schemas/Evidence'}
        user_override: {type: boolean, description: A calorie-only Entry on the explicit user-override path (Evidence user-defined).}
        source_plan_id: {$ref: '#/components/schemas/PlanId'}
        source_analysis_id: {$ref: '#/components/schemas/AnalysisId'}
        health_samples:
          type: array
          items: {$ref: '#/components/schemas/HealthSample'}
        command_id: {$ref: '#/components/schemas/CommandId'}
        updated_at: {$ref: '#/components/schemas/Instant'}
    EntryCommand:
      type: object
      description: Void or Restore one Entry. Retrying never subtracts twice (FRD §18).
      required: [command_id, expected_entry_version]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_entry_version: {type: integer, description: The Entry version the device holds (J114); a stale value is 409
            STALE_REVISION., minimum: 1}
      additionalProperties: false
    EntryEvent:
      type: object
      required: [event_id, operation, entry_version, occurred_at, received_at, command_id]
      properties:
        event_id: {type: string}
        operation: {$ref: '#/components/schemas/Operation'}
        entry_version: {type: integer, minimum: 1}
        occurred_at: {$ref: '#/components/schemas/Instant', description: Device time of the act.}
        received_at: {$ref: '#/components/schemas/Instant'}
        command_id: {$ref: '#/components/schemas/CommandId'}
        device_id: {type: string}
        app_version: {type: string}
        values: {$ref: '#/components/schemas/EntryValues'}
        supersedes: {type: string, description: 'The event this one replaces (Correction, Void, Restore).'}
        scope: {$ref: '#/components/schemas/CorrectionScope'}
    EntryHistory:
      type: object
      description: The Entry history the eater reads (J22) — not the Audit trail.
      required: [entry_id, events]
      properties:
        entry_id: {$ref: '#/components/schemas/EntryId'}
        events:
          type: array
          items: {$ref: '#/components/schemas/EntryEvent'}
          description: Oldest first; append-only (E53).
        replays_to_day: {type: boolean, description: Replaying the Day's Entry events equals the stored Day (FR-042).}
    EntryId:
      type: string
      description: 'An Entry: `en_` + hex.'
      pattern: ^en_[0-9a-f]{4,32}$
      examples: [en_9921]
    EntryMutationResult:
      type: object
      required: [entry, diary_day_id, day_totals, day_revision]
      properties:
        entry: {$ref: '#/components/schemas/Entry'}
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        meal_totals:
          type: array
          items: {$ref: '#/components/schemas/MealTotals'}
        day_totals: {$ref: '#/components/schemas/Totals'}
        day_revision: {type: integer, minimum: 1}
    EntrySnapshot:
      type: object
      description: What the server resolved from the approved Unit snapshot (FRD §18.1); a later Food, Unit or Policy change
        never moves it.
      required: [per_count, evidence]
      properties:
        per_count: {$ref: '#/components/schemas/NutrientVector', description: 'Nutrients of one count of the Unit version
            (or of the typed amount), unrounded.'}
        rule_versions:
          type: array
          items: {type: string}
          description: Food rule versions applied (e.g. bread with every dipped bite).
        source_versions:
          type: array
          items: {type: string}
          description: Food, Recipe and Tier B recipe record versions the numbers came from.
        evidence: {$ref: '#/components/schemas/Evidence'}
        value_basis: {$ref: '#/components/schemas/ValueBasis'}
    EntryState:
      type: string
      enum: [pending, confirmed, corrected, voided, restored]
      description: 'Entry: Pending (device only) → Confirmed; Confirmed → Corrected (an older version replaced) · Voided →
        Restored. The server never returns Pending (J113).'
    EntryValues:
      type: object
      description: The values of one Entry version.
      properties:
        count: {$ref: '#/components/schemas/Count'}
        amount_g: {$ref: '#/components/schemas/ExactNumber'}
        unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
        eaten_at: {$ref: '#/components/schemas/Instant'}
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        nutrients: {$ref: '#/components/schemas/NutrientVector'}
    Error:
      type: object
      description: The one error body of every non-2xx answer. Nothing was done when it is returned; the same command may
        be retried with the same `command_id` (FRD §18.2).
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNIT_NOT_FOUND, UNIT_AMBIGUOUS, STALE_REVISION, SOURCE_BASIS_UNKNOWN, MASS_BALANCE_ERROR, MACROS_INCOMPLETE,
            PLAN_INFEASIBLE, AI_UNAVAILABLE, RATE_LIMITED, VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONSENT_REQUIRED,
            AGE_REQUIREMENT, POLICY_FLOOR, GRANT_REQUIRED, GRANT_NOT_ACTIVE, SERVICE_UNAVAILABLE]
          description: 'The vocabulary''s error list (D2, extended by D4 with SERVICE_UNAVAILABLE), nothing else (J39). HTTP
            status per code (J38): UNAUTHENTICATED 401 · FORBIDDEN, GRANT_REQUIRED, CONSENT_REQUIRED 403 · GRANT_NOT_ACTIVE
            403 (409 on an answer after the request closed) · NOT_FOUND 404 · STALE_REVISION 409 · VALIDATION_ERROR 422 (409
            with `reason` for a conflict that has no code of its own, J35) · UNIT_NOT_FOUND, UNIT_AMBIGUOUS, SOURCE_BASIS_UNKNOWN,
            MASS_BALANCE_ERROR, MACROS_INCOMPLETE, AGE_REQUIREMENT, POLICY_FLOOR, PLAN_INFEASIBLE 422 · RATE_LIMITED 429 ·
            AI_UNAVAILABLE, SERVICE_UNAVAILABLE 503.'
        message: {type: string, description: One plain English sentence for logs and the console. The app never shows it or
            the code; it shows its own catalogue text for the code (J148).}
        field: {type: string, description: 'The request field the error is about, for an error shown beside the field (`components`,
            `diary_day_id`, `areas`, `note` …).'}
        current_revision: {type: integer, description: 'With 409 `STALE_REVISION` only: the revision now stored (the Entry
            version for Entry commands), so the device can show the choice (FRD §18.2, J69).', minimum: 0}
        reason: {type: string, description: 'A machine word that narrows the code, e.g. `request_waiting`, `already_retried`
            (409, J35), `outside_days`, `outside_areas`, `no_grant` (GRANT_REQUIRED, J7), `plan_expired`, `locked`.'}
        state: {type: string, description: 'The current state, with `GRANT_NOT_ACTIVE` (e.g. `expired`, `unanswered`) and
            with a 409 `VALIDATION_ERROR` (J35).'}
        limit:
          type: string
          enum: [floor, hard_stop]
          description: 'With `POLICY_FLOOR`: which Policy limit refused the value (J100).'
        resets_at: {$ref: '#/components/schemas/Instant', description: 'With `RATE_LIMITED`: when the daily AI quota resets
            — the eater''s next diary-day boundary (J91), as a UTC instant the app shows in the eater''s local time (J38).'}
        request_id: {type: string, description: The request id carried end to end in logs and the Audit trail (A20).}
    EscalateJob:
      type: object
      required: [command_id, case_ref]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        case_ref: {$ref: '#/components/schemas/CaseRef'}
