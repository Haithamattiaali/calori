# Sips & Bytes — the API contract (OpenAPI 3.1.0), 2026-10-01.
# Contract-first (way/model.md A2). Read contracts/README.md before changing it: a change is a dated delta.
openapi: 3.1.0
info:
  title: Sips & Bytes API
  version: 1.0.0-2026-10-01
  summary: The eater app, the admin console and the system jobs of Sips & Bytes.
  description: |
    The one HTTP contract of Sips & Bytes (model decision A2: REST, versioned `/v1`, contract-first). The FastAPI server
    implements it; the iPhone's API client is generated from it (swift-openapi-generator); contract tests check both
    sides against it. Sources: `way/model.md` §3 (modules and routes), `way/join.md` (paths, field names, error rules),
    `way/vocabulary.md` (D2–D4), `way/events.md`, `way/seed.md` (examples), FRD §17–§18. See `contracts/README.md`.

    **Who calls what.** Eater paths (`/v1/...`, `/v1/me/...`) take a Firebase ID token as a bearer (`eaterBearer`); the
    AI paths (`POST /v1/analyses`, `POST /v1/analyses/{id}/answers`) also take a limited-use App Check token
    (`appCheck`, A8). Staff paths (`/v1/admin/...`, `/v1/support/...`, and the staff side of `/v1/grants`) take the
    console session cookie (`staffSession`); every staff mutation also takes the CSRF header (`csrf`). A staff
    identity on an eater path is 403 `FORBIDDEN` for every id, so existence is never revealed (J33); an eater naming
    another eater's id gets 404 `NOT_FOUND` (path) or 422 `UNIT_NOT_FOUND` (body) (J34). Paths marked
    `x-build: test` exist only in test builds.

    **Numbers.** Energy, mass, volume, nutrients, shares, money, percentages and factors are JSON **strings**, never
    JSON numbers: `ExactNumber` is an exact decimal (`"62.5"`) or, when the value has no finite decimal, a reduced
    rational (`"187/3"`); `Decimal` is an exact decimal (money in USD, `_pct` percentages 0–100, factors such as
    `credit_factor` `"0.5"`). Precision is exact: the API never rounds a stored or computed value (FRD §10.2 rounds
    only the shown figure); where the product fixes a shown figure it is a separate field (`intake_target_kcal_shown`
    to 10 kcal; `Shares.shown` by largest remainder to one decimal). Why strings: JSON numbers are decoded as IEEE-754
    doubles by Swift's `JSONDecoder`, Python's `json` and most tools, which cannot hold 0.1 or 187/3 exactly; the
    nutrition core keeps `Fraction`/`Decimal` (A6) and the golden cases (NFR-01) must survive every hop. An unknown
    nutrient is `null`, never `"0"`. Counts of things, revisions, versions, `seq`, attempts and minutes are JSON
    integers. Instants are UTC ending `Z` (`_at`); a Day is `diary_day_id` (`YYYY-MM-DD`); local times end `_local`.

    **Commands.** Every POST, PUT, PATCH and DELETE carries `command_id` (a UUID made once per act) except the three
    that store nothing — `POST /v1/targets/proposals`, `POST /v1/units/name-match` and the test controls. A resent
    `command_id` returns the original answer and writes `command.duplicate_ignored`, never a second change (A5).
    Commands that edit a versioned thing carry the version the caller saw: `expected_entry_version` on Entry
    corrections, moves, voids, restores and Health reports (FRD §18 "expected entry version", events.md), and
    `expected_revision` (or `expected_version`, `based_on` for Policy) everywhere else; a stale value is 409
    `STALE_REVISION` with `current_revision`. Consume is not checked against the Day's revision (J114). Request bodies
    are closed (`additionalProperties: false`): the client can never send its own totals (FRD §18.1).

    **Errors.** One `Error` body; `code` is exactly the vocabulary's list (D2 + D4). Each operation lists the codes it
    may return in `x-error-codes` (by HTTP status, J38).

    **Extensions.** `x-module` — the owning module (model §3.2). `x-events` — the events (events.md names) the
    operation writes in its own transaction, on success or refusal; `x-events-later` — events a job or the clock writes
    later for what the operation started. Two events may follow any operation and are listed only where a story tests
    them: `access.refused` (every 403 `FORBIDDEN`) and `command.duplicate_ignored` (every repeated `command_id`).
    `x-stories` — a few story ids the operation serves. `x-contract-added` — a path this contract adds where model §3.2
    names the interface but no route (to be banked by a dated delta).
  license: {name: Proprietary — synthetic examples only, identifier: LicenseRef-SipsAndBytes}
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
- {url: /, description: 'The deployment''s own origin (hosting: none yet, A23).'}
security: []
tags:
- {name: platform, description: 'The kernel: transactions, the clock, ids, the command store. Its routes exist in test builds
    only (J51). (model §3.2)'}
- {name: audit, description: 'The Audit trail store: append-only, gap-free `seq`, hash-chained. (model §3.2)'}
- {name: jobs, description: 'Job runs and the queue: retry and escalate under the same id. (model §3.2)'}
- {name: identity, description: 'Accounts, devices, staff accounts and console sessions. (model §3.2)'}
- {name: access, description: 'Permissions, roles and assignments; deny by default. (model §3.2)'}
- {name: gates, description: Launch gates (Settings › launch gates). (model §3.2)}
- {name: profile, description: The eater's settings and safety mode. (model §3.2)}
- {name: privacy, description: 'Age, Consent, Wording, Privacy jobs, retention. (model §3.2)'}
- {name: policy, description: The nutrition Policy (Nutrition approver). (model §3.2)}
- {name: reference, description: 'Foods, Tier B recipe records, Aliases, Flags, Label submissions, USDA releases. (model §3.2)'}
- {name: registry, description: 'Registry, quotas, prices, the AI spend cap, evaluation. (model §3.2)'}
- {name: units, description: 'Units, Composites, Recipes, Food rules, Templates. (model §3.2)'}
- {name: targets, description: Target versions and Suggested Targets. (model §3.2)}
- {name: analysis, description: 'Capture, the Analyzer pipeline. (model §3.2)'}
- {name: ledger, description: 'Entries, Days and the ledger transaction (TX-L). (model §3.2)'}
- {name: plans, description: The meal planner. (model §3.2)}
- {name: activity, description: 'Activity, active energy, Weights. (model §3.2)'}
- {name: reports, description: The Day and period reports (owns no collection). (model §3.2)}
- {name: grants, description: 'Just-in-time diary access, both sides. (model §3.2)'}
- {name: support, description: 'Support codes, look-ups, the account panel, requests received outside the app. (model §3.2)'}
- {name: metrics, description: De-identified quality and cost figures. (model §3.2)}
- {name: audit_views, description: 'The Auditor''s views: Anomalies, Consents, Summary, Records of processing, Find account.
    (model §3.2)'}
