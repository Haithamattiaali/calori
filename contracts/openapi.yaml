  /v1/consumption:
    post:
      operationId: consume
      summary: Commit food actually eaten
      tags: [ledger]
      description: 'TX-L. The server resolves nutrients from the approved Unit snapshot; the client never sends totals (FRD
        §18.1). `expected_day_revision` is ignored (J114). With `source_plan_id` the Plan is Confirmed, with `source_analysis_id`
        the Analysis is Approved, in the same transaction. A confirmation whose `made_at` is before the Plan''s `expired_at`
        is accepted once onto the Plan''s Day even when it arrives later (J151); one made after is 409 VALIDATION_ERROR `reason:
        plan_expired` with the Plan''s state, and nothing is written (J149). A resent `command_id` returns the original answer
        (`replayed: true`). An anonymous-session token gets 403 CONSENT_REQUIRED (J124); a staff identity under a Grant gets
        403 FORBIDDEN and `grant.write_refused`.'
