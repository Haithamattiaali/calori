components:
  securitySchemes:
    eaterBearer: {type: http, scheme: bearer, bearerFormat: JWT, description: 'A Firebase Auth ID token (Sign in with Apple,
        email link, or an anonymous session for a local trial''s AI calls, J124), verified server-side with firebase-admin
        (A8).'}
    appCheck: {type: apiKey, in: header, name: X-Firebase-AppCheck, description: 'A limited-use Firebase App Check token on
        AI paths; `already_consumed` is refused. Defence in depth, never a substitute for authorization (FRD §18).'}
    staffSession: {type: apiKey, in: cookie, name: sb_staff_session, description: 'The console session (Secure, HttpOnly,
        SameSite=Strict); 15 minutes idle, warning at 13 (J2). A staff account is never an eater account (D2, A9).'}
    csrf: {type: apiKey, in: header, name: X-CSRF-Token, description: 'The session''s CSRF token (from sign-in), required
        on every staff mutation.'}
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: The install's random device id (E2); carried on every eater command into its domain events.
      schema:
        type: string
        maxLength: 64
        examples: [dev_e1_iphone_103]
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      description: The app version (events.md §1 `app_version`).
      schema:
        type: string
        maxLength: 20
        examples: [1.0.3]
    DiaryDayQuery:
      name: diary_day_id
      in: query
      required: true
      schema: {$ref: '#/components/schemas/DiaryDayId'}
    PageToken:
      name: page_token
      in: query
      required: false
      schema: {type: string, maxLength: 200}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
  headers:
    RequestId:
      description: The request id carried end to end (A20).
      schema: {type: string}
  responses:
    Unauthenticated:
      description: UNAUTHENTICATED — no valid token or session.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            UNAUTHENTICATED:
              value: {code: UNAUTHENTICATED, message: 'The token is missing, expired or not valid.'}
    Forbidden:
      description: FORBIDDEN (the role lacks the permission; also every staff token on an eater path, J33) · CONSENT_REQUIRED
        · GRANT_REQUIRED · GRANT_NOT_ACTIVE (with `state`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            FORBIDDEN:
              value: {code: FORBIDDEN, message: Your role lacks this permission.}
            CONSENT_REQUIRED:
              value: {code: CONSENT_REQUIRED, message: The AI Consent is not Given under the text in force., field: ai_processing}
            GRANT_REQUIRED:
              value: {code: GRANT_REQUIRED, message: Day 2026-09-28 is not in the Grant's Days (2026-09-29 – 2026-09-30).,
                reason: outside_days}
            GRANT_NOT_ACTIVE:
              value: {code: GRANT_NOT_ACTIVE, message: 'The Grant expired at 11:20:00Z.', state: expired}
    NotFound:
      description: NOT_FOUND — absent, or another eater's id; existence is never revealed.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            NOT_FOUND:
              value: {code: NOT_FOUND, message: Not found.}
    Conflict:
      description: STALE_REVISION (with `current_revision`) · VALIDATION_ERROR with `reason` and `state` for a conflict with
        no code of its own (J35) · GRANT_NOT_ACTIVE for an answer after the request closed.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            STALE_REVISION:
              value: {code: STALE_REVISION, message: The Entry was changed on another iPhone; nothing was applied., current_revision: 2,
                request_id: req_7a1e0930}
            VALIDATION_ERROR:
              value: {code: VALIDATION_ERROR, message: A request is already waiting for this eater., reason: request_waiting,
                state: requested, field: account_id}
            GRANT_NOT_ACTIVE:
              value: {code: GRANT_NOT_ACTIVE, message: The request closed before an answer., state: unanswered}
    Unprocessable:
      description: VALIDATION_ERROR (with `field`) · UNIT_NOT_FOUND · UNIT_AMBIGUOUS · SOURCE_BASIS_UNKNOWN · MASS_BALANCE_ERROR
        · MACROS_INCOMPLETE · AGE_REQUIREMENT · POLICY_FLOOR (with `limit`) · PLAN_INFEASIBLE.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            VALIDATION_ERROR:
              value: {code: VALIDATION_ERROR, field: diary_day_id, message: The Day does not match eaten_at under the boundary
                  in effect.}
            UNIT_NOT_FOUND:
              value: {code: UNIT_NOT_FOUND, field: 'items[0].unit_version_id', message: No such Unit version for this eater.}
            UNIT_AMBIGUOUS:
              value: {code: UNIT_AMBIGUOUS, field: unit_version_id, message: Two of your Units share this name.}
            SOURCE_BASIS_UNKNOWN:
              value: {code: SOURCE_BASIS_UNKNOWN, field: 'components[0]', message: The source gives no basis amount for this
                  volume (ml is never g).}
            MASS_BALANCE_ERROR:
              value: {code: MASS_BALANCE_ERROR, field: components, message: The parts weigh 39.1 g; you weighed 38.1 g (tolerance
                  0.762 g).}
            MACROS_INCOMPLETE:
              value: {code: MACROS_INCOMPLETE, field: macro_split, message: 'Protein is unknown, so shares cannot be computed.'}
            AGE_REQUIREMENT:
              value: {code: AGE_REQUIREMENT, message: Sips & Bytes is for adults 18 and older.}
            POLICY_FLOOR:
              value: {code: POLICY_FLOOR, message: 'An entered Target may not be below the floor (1,200 kcal).', limit: floor,
                field: entered_target_kcal}
            PLAN_INFEASIBLE:
              value: {code: PLAN_INFEASIBLE, message: An Infeasible Plan cannot be saved or confirmed.}
    RateLimited:
      description: 'RATE_LIMITED (with `resets_at`): a daily AI quota, the email look-up limit or a trial''s per-install limit.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            RATE_LIMITED:
              value: {code: RATE_LIMITED, message: Today's photo analyses are used (25 of 25)., resets_at: '2026-10-01T21:00:00Z',
                request_id: req_e5_26}
    Unavailable:
      description: AI_UNAVAILABLE (model provider or kill switch; nothing queued) · SERVICE_UNAVAILABLE (a non-AI dependency;
        nothing was done). Retry with the same `command_id`.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            AI_UNAVAILABLE:
              value: {code: AI_UNAVAILABLE, message: The model provider did not answer in time; nothing was logged or queued.,
                request_id: req_5530}
            SERVICE_UNAVAILABLE:
              value: {code: SERVICE_UNAVAILABLE, message: A dependency failed; nothing was done. Retry with the same command_id.}
  schemas:
    AccountId:
      type: string
      description: 'An eater account: `acct_` + 6 lowercase hex (seed.md §1).'
      pattern: ^acct_[0-9a-f]{6}$
      examples: [acct_9c41e2]
    AccountPanel:
      type: object
      description: Allow-listed projections only; opening it writes `account.viewed` and chooses no jobs tab (J13).
      required: [account_id, created_at, devices, consents]
      properties:
        account_id: {$ref: '#/components/schemas/AccountId'}
        created_at: {$ref: '#/components/schemas/Instant'}
        sign_in_method:
          type: string
          enum: [apple, email]
        email_masked:
          type: string
          examples: [r•••@privaterelay.appleid.com]
        devices:
          type: array
          items: {$ref: '#/components/schemas/DeviceView'}
        language: {$ref: '#/components/schemas/Language'}
        numerals: {$ref: '#/components/schemas/Numerals'}
        time_zone: {$ref: '#/components/schemas/TimeZone'}
        boundary_local: {$ref: '#/components/schemas/LocalTime'}
        consents:
          type: array
          items:
            type: object
            required: [purpose, state]
            properties:
              purpose: {$ref: '#/components/schemas/Purpose'}
              state: {$ref: '#/components/schemas/ConsentState'}
              text_version: {$ref: '#/components/schemas/TextVersion'}
              made_at: {$ref: '#/components/schemas/Instant'}
        quota_today:
          type: object
          properties:
            diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
            image_count: {type: integer, minimum: 0}
            image_hard: {type: integer, minimum: 0}
            text_count: {type: integer, minimum: 0}
            text_hard: {type: integer, minimum: 0}
            quotas_version: {type: integer, minimum: 1}
        privacy_jobs:
          type: array
          items: {$ref: '#/components/schemas/PrivacyJob'}
        grants:
          type: array
          items: {$ref: '#/components/schemas/Grant'}
        label_submissions:
          type: array
          items:
            type: object
            required: [submission_id, state]
            properties:
              submission_id: {$ref: '#/components/schemas/LabelSubmissionId'}
              state: {$ref: '#/components/schemas/LabelSubmissionState'}
              reject_reason: {type: string}
        support_code_valid_until: {$ref: '#/components/schemas/Instant'}
    AccountTab:
      type: string
      enum: [privacy-jobs, sync, failed-analyses, activity]
      description: The account panel's job tabs (J13); each tab is its own request.
    AccountTabView:
      type: object
      description: One job tab; the field named like the tab is present.
      required: [account_id, tab]
      properties:
        account_id: {$ref: '#/components/schemas/AccountId'}
        tab: {$ref: '#/components/schemas/AccountTab'}
        privacy_jobs:
          type: array
          items: {$ref: '#/components/schemas/PrivacyJob'}
        sync:
          type: array
          items: {$ref: '#/components/schemas/SyncRow'}
        devices:
          type: array
          items: {$ref: '#/components/schemas/DeviceView'}
        failed_analyses:
          type: array
          items: {$ref: '#/components/schemas/AnalysisMeta'}
        activity_imports:
          type: array
          items: {$ref: '#/components/schemas/ActivityImportMeta'}
    Activity:
      type: object
      required: [activity_id, version, state, origin, start_at, end_at, diary_day_id, energy_kcal]
      properties:
        activity_id: {$ref: '#/components/schemas/ActivityId'}
        version: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/ActivityState'}
        origin: {$ref: '#/components/schemas/ActivityOrigin'}
        provider_record_id: {type: string}
        source_name: {type: string}
        kind: {type: string}
        start_at: {$ref: '#/components/schemas/Instant'}
        end_at: {$ref: '#/components/schemas/Instant'}
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId', description: The Day it starts in (J134).}
        energy_kcal: {$ref: '#/components/schemas/ExactNumber', description: Active energy that counts.}
        energy_basis: {$ref: '#/components/schemas/EnergyBasis'}
        entered_energy_kcal: {$ref: '#/components/schemas/ExactNumber'}
        import_revision: {type: integer, minimum: 0}
        override: {type: boolean}
        linked_to: {$ref: '#/components/schemas/ActivityId'}
    ActivityCommand:
      type: object
      required: [command_id, expected_revision]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_revision: {type: integer, minimum: 1}
      additionalProperties: false
    ActivityCoverage:
      type: object
      description: Activity coverage (J50).
      required: [state]
      properties:
        source:
          type: string
          examples: [apple_health]
        last_sync_at: {$ref: '#/components/schemas/Instant'}
        state:
          type: string
          enum: [data, no_data, not_connected]
    ActivityCreditOffer:
      type: object
      description: '"New activity credit available: <factor> % up to <cap> kcal — Review": the newer Policy''s credit, when
        it differs from the eater''s Activity-adjusted Target version. Changes nothing until approved (J103, J156).'
      required: [policy_version, credit_factor, credit_cap_kcal, current]
      properties:
        policy_version: {type: integer, minimum: 1, description: The Policy version in effect that offers this credit.}
        credit_factor: {$ref: '#/components/schemas/Decimal', description: 'A decimal fraction: "0.4" = 40 % (D6-A8, J156).'}
        credit_cap_kcal: {$ref: '#/components/schemas/ExactNumber'}
        current:
          type: object
          description: The eater's own approved credit, which stays until they approve another.
          required: [target_version_id, credit_factor, credit_cap_kcal, policy_version]
          properties:
            target_version_id: {$ref: '#/components/schemas/TargetVersionId'}
            credit_factor: {$ref: '#/components/schemas/Decimal'}
            credit_cap_kcal: {$ref: '#/components/schemas/ExactNumber'}
            policy_version: {type: integer, minimum: 1}
    ActivityCreditOfferAnswer:
      type: object
      description: '`offer` absent when there is none (Fixed mode, or the same credit).'
      properties:
        offer: {$ref: '#/components/schemas/ActivityCreditOffer'}
    ActivityDay:
      type: object
      required: [diary_day_id, eligible_kcal, activity_coverage]
      properties:
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        eligible_kcal: {$ref: '#/components/schemas/ExactNumber'}
        active_energy_kcal: {$ref: '#/components/schemas/NutrientValue'}
        activity_coverage: {$ref: '#/components/schemas/ActivityCoverage'}
        revision: {type: integer, minimum: 0}
