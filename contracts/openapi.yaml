      type: object
      required: [grant_id, templates]
      properties:
        grant_id: {$ref: '#/components/schemas/GrantId'}
        templates:
          type: array
          items: {$ref: '#/components/schemas/Template'}
    GrantUnitsView:
      type: object
      required: [grant_id, units]
      properties:
        grant_id: {$ref: '#/components/schemas/GrantId'}
        units:
          type: array
          items:
            type: object
            required: [unit, versions]
            properties:
              unit: {$ref: '#/components/schemas/Unit'}
              versions:
                type: array
                items: {$ref: '#/components/schemas/UnitVersion'}
    HealthSample:
      type: object
      description: An Apple Health food correlation written by the confirming iPhone (J123).
      required: [sample_id, device_id]
      properties:
        sample_id: {type: string}
        device_id: {type: string}
    HealthSampleReport:
      type: object
      description: The confirming iPhone reports its Apple Health write (J123); the device id comes from `X-Device-Id`.
      required: [command_id, kind, sample_id, expected_entry_version]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        kind:
          type: string
          enum: [written, rewritten, deleted]
        sample_id: {type: string}
        expected_entry_version: {type: integer, minimum: 1}
      additionalProperties: false
    ImportActiveEnergy:
      type: object
      required: [diary_day_id, energy_kcal]
      properties:
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        energy_kcal: {$ref: '#/components/schemas/ExactNumber'}
        source: {type: string}
      additionalProperties: false
    ImportBodyMass:
      type: object
      required: [provider_record_id, measured_at, kg]
      properties:
        provider_record_id: {type: string}
        measured_at: {$ref: '#/components/schemas/Instant'}
        kg: {$ref: '#/components/schemas/ExactNumber'}
        deleted: {type: boolean}
      additionalProperties: false
    ImportResult:
      type: object
      description: accepted · updated · duplicate · conflict results (FRD §18).
      required: [import_id, ran_at, accepted, updated, duplicate, conflict]
      properties:
        import_id: {type: string}
        ran_at: {$ref: '#/components/schemas/Instant'}
        accepted: {type: integer, minimum: 0}
        updated: {type: integer, minimum: 0}
        duplicate: {type: integer, minimum: 0}
        conflict: {type: integer, minimum: 0}
        activity_days:
          type: array
          items: {$ref: '#/components/schemas/ActivityDay'}
    ImportWorkout:
      type: object
      required: [provider_record_id, start_at, end_at, energy_kcal, energy_basis]
      properties:
        provider_record_id: {type: string}
        source_name: {type: string}
        kind: {type: string}
        start_at: {$ref: '#/components/schemas/Instant'}
        end_at: {$ref: '#/components/schemas/Instant'}
        energy_kcal: {$ref: '#/components/schemas/ExactNumber'}
        energy_basis: {$ref: '#/components/schemas/EnergyBasis'}
        import_revision: {type: integer, minimum: 0}
        deleted: {type: boolean, description: 'Deleted in Health: removed here, once (eater-7.7).'}
      additionalProperties: false
    Instant:
      type: string
      description: A UTC instant, ISO 8601 ending in `Z`; every field ending `_at` (J50, J147).
      format: date-time
      pattern: Z$
      examples: ['2026-10-01T09:00:00Z']
    IsoDuration:
      type: string
      description: An ISO 8601 duration in hours and/or minutes (`PT72H`, `PT15M`).
      pattern: ^PT([0-9]+H([0-9]+M)?|[0-9]+M)$
      examples: [PT72H]
    Job:
      type: object
      description: De-identified on Jobs (no account id for the Platform admin).
      required: [job_id, kind, state, attempts]
      properties:
        job_id: {$ref: '#/components/schemas/JobId'}
        kind: {$ref: '#/components/schemas/JobKind'}
        state: {$ref: '#/components/schemas/JobState'}
        owner_module: {type: string}
        attempts: {type: integer, minimum: 0, maximum: 5}
        attempt_budget:
          type: integer
          enum: [5]
        failure_reason: {$ref: '#/components/schemas/FailureReason'}
        stage: {type: string}
        next_attempt_at: {$ref: '#/components/schemas/Instant'}
        due_by: {$ref: '#/components/schemas/Instant'}
        escalated:
          type: object
          properties:
            by: {$ref: '#/components/schemas/StaffId'}
            case_ref: {$ref: '#/components/schemas/CaseRef'}
            at: {$ref: '#/components/schemas/Instant'}
        needs_engineering: {type: boolean, description: '5 of 5: Retry is disabled (J142).'}
        created_at: {$ref: '#/components/schemas/Instant'}
        updated_at: {$ref: '#/components/schemas/Instant'}
    JobId:
      type: string
      description: Any Job id (a Privacy job id, a retention run `R-…`, or another job's id). The id never changes across
        retries.
      examples: [job_del_2205, R-0805]
    JobKind:
      type: string
      enum: [export, deletion, consent_withdrawal, analysis, usda_import, retention, evaluation, regression_set, grant_window,
        policy_effective, metrics_rollup, audit_retention]
    JobPage:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: {$ref: '#/components/schemas/Job'}
        next_page_token: {type: string}
    JobStage:
      type: object
      required: [name, state]
      properties:
        name:
          type: string
          examples: [processors told (Google)]
        state: {$ref: '#/components/schemas/StageState'}
        at: {$ref: '#/components/schemas/Instant'}
        attempts: {type: integer, minimum: 0, maximum: 5}
        counts:
          type: object
          properties: {}
        expected_by: {$ref: '#/components/schemas/Instant'}
    JobState:
      type: string
      enum: [requested, running, completed, failed]
      description: 'Privacy job and every other Job: Requested → Running → Completed · Failed (retried with the same id).'
    KillSwitch:
      type: string
      enum: ['on', 'off']
      description: The kill switch of one AI task is On or Off — never "paused" (J94, J148).
    KillSwitchCommand:
      type: object
      required: [command_id, state]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        state: {$ref: '#/components/schemas/KillSwitch'}
        reason: {type: string, description: Optional; "reason not given" is recorded., maxLength: 200}
      additionalProperties: false
    KillSwitchResult:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: {$ref: '#/components/schemas/RegistryTask'}
    LabelSubmission:
      type: object
      description: A Label submission (E27); its photos are never shown to Support (J85).
      required: [submission_id, state, created_at]
      properties:
        submission_id: {$ref: '#/components/schemas/LabelSubmissionId'}
        state: {$ref: '#/components/schemas/LabelSubmissionState'}
        food_version_id: {$ref: '#/components/schemas/FoodVersionId'}
        reject_reason: {type: string}
        created_at: {$ref: '#/components/schemas/Instant'}
        decided_at: {$ref: '#/components/schemas/Instant'}
    LabelSubmissionCommand:
      type: object
      required: [command_id, own_food_version_id]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        own_food_version_id: {$ref: '#/components/schemas/FoodVersionId', description: The eater's own label record the photos
            show.}
        barcode: {type: string, maxLength: 32}
      additionalProperties: false
    LabelSubmissionId:
      type: string
      description: A Label submission `L-nn`.
      pattern: ^L-[0-9]{2,}$
      examples: [L-17]
    LabelSubmissionState:
      type: string
      enum: [proposed, in_review, approved, rejected]
      description: 'Label submission: Proposed → In review → Approved · Rejected.'
    LabelSubmissionUpload:
      type: object
      required: [command, photo]
      properties:
        command: {$ref: '#/components/schemas/LabelSubmissionCommand'}
        photo: {type: string, description: The label photo; the server crops it to the label and strips EXIF (FR-077)., contentMediaType: image/jpeg}
    Language:
      type: string
      enum: [ar, en]
      description: App or console language.
    LaunchGate:
      type: object
      required: [gate, result]
      properties:
        gate: {$ref: '#/components/schemas/LaunchGateKey'}
        result: {type: string}
        signer: {type: string}
        version_reviewed: {type: string}
        recorded_at: {$ref: '#/components/schemas/Instant'}
        next_check_due: {$ref: '#/components/schemas/DiaryDayId'}
    LaunchGateKey:
      type: string
      enum: [ai_credential, dependency_audit, restore_test, privacy_review, nutrition_policy_review, provider_data_settings,
        launch_dishes]
    LaunchGateList:
      type: object
      required: [gates]
      properties:
        gates:
          type: array
          items: {$ref: '#/components/schemas/LaunchGate'}
    LinkActivity:
      type: object
      required: [command_id, expected_revision, link_to]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_revision: {type: integer, minimum: 1}
        link_to: {$ref: '#/components/schemas/ActivityId', description: The imported Activity it is the same as.}
      additionalProperties: false
    LocalTime:
      type: string
      description: A local wall-clock time `HH:MM` (fields ending `_local`).
      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      examples: ['03:00']
    LookUp:
      type: object
      required: [command_id, method]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        method: {$ref: '#/components/schemas/LookUpMethod'}
        support_code: {$ref: '#/components/schemas/SupportCodeValue'}
        email: {type: string, description: Matched inside Firebase Auth; never stored or logged (E1)., format: email}
        case_ref: {$ref: '#/components/schemas/CaseRef', description: Required with `email` (J2).}
        deletion_reference: {$ref: '#/components/schemas/DeletionReference'}
        grant_id: {$ref: '#/components/schemas/GrantId'}
        account_id: {$ref: '#/components/schemas/AccountId'}
        reason: {type: string, description: The Auditor's reason (Find account)., maxLength: 200}
      additionalProperties: false
    LookUpMethod:
      type: string
      enum: [support_code, email, deletion_reference, grant, account_id]
    LookUpResult:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [done, not_found]
        account_id: {$ref: '#/components/schemas/AccountId'}
        completion_record: {$ref: '#/components/schemas/CompletionRecord', description: A deletion reference finds only this
            (support-9.12).}
        message_key:
          type: string
          examples: [no_account_matches_this_email]
    MacroGrams:
      type: object
      properties:
        protein_g: {$ref: '#/components/schemas/ExactNumber'}
        carbohydrate_g: {$ref: '#/components/schemas/ExactNumber'}
        fat_g: {$ref: '#/components/schemas/ExactNumber'}
      additionalProperties: false
    MacroSplit:
      type: object
      required: [protein_pct, carbohydrate_pct, fat_pct]
      properties:
        protein_pct: {$ref: '#/components/schemas/Decimal'}
        carbohydrate_pct: {$ref: '#/components/schemas/Decimal'}
        fat_pct: {$ref: '#/components/schemas/Decimal'}
      additionalProperties: false
    MarkDayCommand:
      type: object
      required: [command_id, mark, expected_revision]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        mark: {$ref: '#/components/schemas/DayMark'}
        expected_revision: {type: integer, description: The Day revision the device holds., minimum: 0}
      additionalProperties: false
    MealTotals:
      type: object
      description: 'A Meal: the Entries with one meal name on one Day (J112).'
      required: [meal_name, entry_ids, totals]
      properties:
        meal_name:
          type: string
          description: The meal name (Breakfast, Lunch, Dinner, Snack by default, or the eater's own).
          examples: [Breakfast]
        entry_ids:
          type: array
          items: {$ref: '#/components/schemas/EntryId'}
        totals: {$ref: '#/components/schemas/Totals'}
        shares: {$ref: '#/components/schemas/Shares'}
    MeasurementEvidence:
      type: object
      required: [display_value, display_unit, method]
      properties:
        display_value: {$ref: '#/components/schemas/ExactNumber'}
        display_unit:
          type: string
          enum: [g, ml, oz, lb]
        tare_g: {$ref: '#/components/schemas/ExactNumber'}
        gross_g: {$ref: '#/components/schemas/ExactNumber'}
        net_g: {$ref: '#/components/schemas/ExactNumber'}
        method:
          type: string
          enum: [typed, scale_photo, before_after, average_of_pieces, volume_with_density]
        scale_step_g: {$ref: '#/components/schemas/ExactNumber', description: The scale's step; tolerance = the larger of
            2 % of the total and this (J74).}
        sample_count: {type: integer, minimum: 1}
        single_weights_g:
          type: array
          items: {$ref: '#/components/schemas/ExactNumber'}
        keep_photo: {type: boolean, description: '"Keep photo with this unit"; otherwise the raw scan goes after 30 days (J76).'}
        confirmation: {type: boolean}
      additionalProperties: false
    MetricRow:
      type: object
      required: [hidden]
      properties:
        evidence: {$ref: '#/components/schemas/Evidence'}
        task: {$ref: '#/components/schemas/Task'}
        registry_version: {$ref: '#/components/schemas/RegistryVersionRef'}
        language: {$ref: '#/components/schemas/Language'}
        food_id: {$ref: '#/components/schemas/FoodId'}
        analyses: {type: integer, minimum: 0}
        accepted: {type: integer, minimum: 0}
        acceptance_pct: {$ref: '#/components/schemas/Decimal'}
        validation_failures: {type: integer, minimum: 0}
        clarifications: {type: integer, minimum: 0}
        hidden: {type: boolean, description: 'Fewer than 11 distinct eaters: hidden, and not derivable (J44).'}
    Model:
      type: object
      required: [model_id, status]
      properties:
        model_id:
          type: string
          examples: [gemini-3.8-flash]
        status:
          type: string
          enum: [stable, preview]
        surfaces:
          type: array
          items: {type: string}
        location:
          type: string
          examples: [global]
        retirement_on: {$ref: '#/components/schemas/DiaryDayId'}
        notice: {type: string}
        recorded_by: {type: string}
        recorded_at: {$ref: '#/components/schemas/Instant'}
    ModelIn:
      type: object
      required: [command_id, model_id, status]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        model_id: {type: string, description: A frozen id; floating aliases ("latest") are refused (admin-10.7)., pattern: '^[a-z0-9][a-z0-9.-]*$',
          maxLength: 80}
        status:
          type: string
          enum: [stable, preview]
        surfaces:
          type: array
          items: {type: string}
        location: {type: string}
        retirement_on: {$ref: '#/components/schemas/DiaryDayId'}
        notice: {type: string, maxLength: 200}
      additionalProperties: false
    MoveVersion:
      type: object
      required: [command_id, to, expected_revision]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        to:
          type: string
          enum: [shadow, canary, rollout]
        share_pct: {$ref: '#/components/schemas/Decimal', description: Canary only (sticky buckets).}
        expected_revision: {type: integer, description: The task revision shown; two admins at once → 409 STALE_REVISION (admin-10.30).,
          minimum: 0}
        reason: {type: string, maxLength: 200}
      additionalProperties: false
    NewRecipeVersion:
      type: object
      description: Cook it again, weigh the new pot (eater-2.33).
      required: [command_id, expected_revision, ingredients]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_revision: {type: integer, minimum: 1}
        ingredients:
          type: array
          items: {$ref: '#/components/schemas/RecipeIngredient'}
          minItems: 1
        additions:
          type: array
          items: {$ref: '#/components/schemas/RecipeIngredient'}
        discards:
          type: array
          items: {$ref: '#/components/schemas/RecipeIngredient'}
        cooked_yield_g: {$ref: '#/components/schemas/ExactNumber'}
      additionalProperties: false
    NewUnitVersion:
      type: object
      description: 'Recalibrate or change ingredients: version n+1; prior logs unchanged (FRD §18).'
      required: [command_id, expected_revision]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_revision: {type: integer, description: The Unit's current version as the editor showed it; another value
            is 409 STALE_REVISION (eater-2.47)., minimum: 1}
        components:
          type: array
          items: {$ref: '#/components/schemas/UnitComponent'}
          minItems: 1
        measured_total_g: {$ref: '#/components/schemas/ExactNumber'}
        measurement_evidence:
          type: array
          items: {$ref: '#/components/schemas/MeasurementEvidence'}
        user_override:
          type: object
          required: [energy_kcal]
          properties:
            energy_kcal: {$ref: '#/components/schemas/ExactNumber'}
          additionalProperties: false
      additionalProperties: false
    Numerals:
      type: string
      enum: [western, arabic_indic]
      description: Digit setting for display; exports always use Western digits (J137).
    NutrientValue:
      type: [string, 'null']
      description: An ExactNumber, or `null` when the source does not give the nutrient — unknown is never 0 (FRD §17 "null
        macros are different from zero").
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?(/[1-9][0-9]*)?$
      examples: ['2.5', null]
    NutrientVector:
      type: object
      description: Unrounded nutrients of one amount; `null` = unknown (never 0).
      required: [energy_kcal, protein_g, carbohydrate_g, fat_g]
      properties:
        energy_kcal: {$ref: '#/components/schemas/NutrientValue'}
        protein_g: {$ref: '#/components/schemas/NutrientValue'}
        carbohydrate_g: {$ref: '#/components/schemas/NutrientValue'}
        fat_g: {$ref: '#/components/schemas/NutrientValue'}
        fiber_g: {$ref: '#/components/schemas/NutrientValue'}
        sugars_g: {$ref: '#/components/schemas/NutrientValue'}
        sugar_alcohols_g: {$ref: '#/components/schemas/NutrientValue'}
        carbohydrate_basis: {$ref: '#/components/schemas/CarbohydrateBasis'}
    Operation:
      type: string
      enum: [consume, correct, move, void, restore]
      description: Entry event operation (FRD §17 ConsumptionEvent).
    OutsideChannel:
      type: string
      enum: [email, chat, phone]
    OutsideRequest:
      type: object
      required: [request_id, state, type, channel, received_at, case_ref, due_by]
      properties:
        request_id: {$ref: '#/components/schemas/OutsideRequestId'}
        state: {$ref: '#/components/schemas/OutsideRequestState'}
        type:
          type: string
          enum: [access_or_export, deletion, consent_withdrawal, other]
        channel: {$ref: '#/components/schemas/OutsideChannel'}
        received_at: {$ref: '#/components/schemas/Instant'}
        case_ref: {$ref: '#/components/schemas/CaseRef'}
        account_id: {$ref: '#/components/schemas/AccountId'}
        due_by: {$ref: '#/components/schemas/Instant', description: + 30 days; "due soon" at ≤ 7 days (J45).}
        due_soon: {type: boolean}
        outcome: {type: string, maxLength: 120}
        recorded_by: {$ref: '#/components/schemas/StaffId'}
        job_id: {$ref: '#/components/schemas/PrivacyJobId'}
    OutsideRequestId:
      type: string
      description: 'A Request received outside the app: `oreq_` + hex.'
      pattern: ^oreq_[0-9a-f]{4,32}$
      examples: [oreq_7e01]
    OutsideRequestIn:
      type: object
      required: [command_id, type, channel, received_at, case_ref]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        type:
          type: string
          enum: [access_or_export, deletion, consent_withdrawal, other]
        channel: {$ref: '#/components/schemas/OutsideChannel'}
        received_at: {$ref: '#/components/schemas/Instant'}
        case_ref: {$ref: '#/components/schemas/CaseRef'}
        account_id: {$ref: '#/components/schemas/AccountId'}
        outcome: {type: string, description: '≤ 120 characters, no content.', maxLength: 120}
      additionalProperties: false
    OutsideRequestList:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: {$ref: '#/components/schemas/OutsideRequest'}
    OutsideRequestPatch:
      type: object
      required: [command_id, action]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        action:
          type: string
          enum: [link_job, escalate, close]
        job_id: {$ref: '#/components/schemas/PrivacyJobId', description: 'With `link_job`: the in-app Privacy job that answers
            it; it closes when the job Completes.'}
        outcome: {type: string, description: No content., maxLength: 120}
      additionalProperties: false
    OutsideRequestState:
      type: string
      enum: [open, escalated, closed]
      description: 'Request received outside the app: Open → Escalated → Closed.'
    PeriodDay:
      type: object
      required: [diary_day_id, state, consumed_kcal]
      properties:
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        state: {$ref: '#/components/schemas/DayState'}
        consumed_kcal: {$ref: '#/components/schemas/NutrientValue', description: '`null` for an Unlogged Day: unknown, not
            zero (AT-25).'}
        target_kcal: {$ref: '#/components/schemas/ExactNumber'}
        target_version_id: {$ref: '#/components/schemas/TargetVersionId'}
        intake_vs_target_kcal: {$ref: '#/components/schemas/ExactNumber'}
        macros_complete: {type: boolean}
    PeriodReport:
      type: object
      description: A period compared with effective-dated Targets, with missing-Day and completeness information (FRD §18).
      required: [start, end, days, days_logged, days_unlogged]
      properties:
        start: {$ref: '#/components/schemas/DiaryDayId'}
        end: {$ref: '#/components/schemas/DiaryDayId'}
        days:
          type: array
          items: {$ref: '#/components/schemas/PeriodDay'}
        days_logged: {type: integer, minimum: 0}
        days_unlogged: {type: integer, minimum: 0}
        days_complete: {type: integer, minimum: 0}
        average_kcal: {$ref: '#/components/schemas/ExactNumber', description: Over logged Days only.}
        intake_vs_target_kcal: {$ref: '#/components/schemas/ExactNumber', description: 'Σ(consumed − Target effective that
            Day) over logged Days ("Intake vs Target", J129).'}
        fiber_g: {$ref: '#/components/schemas/NutrientValue'}
        sugars_g: {$ref: '#/components/schemas/NutrientValue'}
    PeriodSummary:
      type: object
      required: [from, to, counts]
      properties:
        from: {$ref: '#/components/schemas/Instant'}
        to: {$ref: '#/components/schemas/Instant'}
        counts:
          type: object
          description: Events per action.
          properties: {}
        last_retention_run:
          type: object
          properties:
            seq: {type: integer, minimum: 1}
            ran_at: {$ref: '#/components/schemas/Instant'}
            detail: {$ref: '#/components/schemas/RetentionRunDetail'}
            chain_check:
              type: string
              enum: [passed, failed]
        chain_intact_through_seq: {type: integer, minimum: 0}
    Permission:
      type: string
      enum: [read_registry, propose_registry_versions, move_versions, roll_back, use_kill_switch, change_quotas, change_prices,
        read_metrics, read_failed_jobs, retry_failed_jobs, escalate_jobs, read_roles, change_roles, read_audit_trail_changes,
        read_audit_trail, add_review_note, view_evaluation_cases, read_reference, approve_reference, propose_approve_policy,
        read_account_state, request_grant, read_grants, change_grant_settings, record_outside_requests, sign_launch_gates,
        publish_wording]
      description: 'The fixed permission keys (seed.md §3, J40), in the order of Roles › Permissions: Read the Registry ·
        Propose Registry versions · Move versions between states · Roll back · Use the kill switch · Change quotas · Change
        prices · Read Metrics · Read failed jobs · Retry failed jobs · Escalate jobs · Read roles · Change roles · Read the
        Audit trail for Registry, Roles and Jobs · Read the whole Audit trail · Add a review note · View consented evaluation
        cases · Read reference (Foods, Recipes, Aliases, Policy) · Approve Foods, Recipes and Aliases · Propose and approve
        Policy versions · Read account state · Request a Grant · Read Grants (all) · Change Grant settings · Record requests
        received outside the app · Sign launch gates · Publish wording.'
    Plan:
      type: object
      description: 'A Plan has no consumed calories until Confirmed. An Infeasible answer is 200 with `state: infeasible`
        and `blocking[]` — an answer, not an error (J38).'
      required: [solution_status]
      properties:
        plan_id: {$ref: '#/components/schemas/PlanId', description: Absent when `solution_status` is `unknown` (no Plan is
            made).}
        state: {$ref: '#/components/schemas/PlanState'}
        solution_status: {$ref: '#/components/schemas/SolutionStatus'}
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        scope:
          type: string
          enum: [meal, day]
        counts:
          type: array
          items: {$ref: '#/components/schemas/PlanCount'}
        selected_versions:
          type: array
          items: {$ref: '#/components/schemas/UnitVersionId'}
          description: Pinned for confirmation (J130).
        verified_totals: {$ref: '#/components/schemas/NutrientVector', description: Re-checked unrounded by nutrition_core
            after the solver (A7).}
        shares_by_count:
          type: object
          description: Share of each Unit by count, keyed by unit_version_id.
          properties: {}
        shares_by_calories:
          type: object
          description: Share of each Unit by calories, keyed by unit_version_id (AT-18).
          properties: {}
        blocking:
          type: array
          items: {$ref: '#/components/schemas/PlanBlocking'}
        changes:
          type: array
          items: {$ref: '#/components/schemas/PlanChange'}
        left_out:
          type: array
          items: {type: string}
        assumptions:
          type: array
          items: {type: string}
        explanation: {type: string, description: Task Explain; repeats only verified numbers.}
        calorie_aim_source:
          type: string
          enum: [left_today, typed, ceiling]
        confirmed_as: {$ref: '#/components/schemas/ConfirmedAs'}
        entry_ids:
          type: array
          items: {$ref: '#/components/schemas/EntryId'}
        expired_at: {$ref: '#/components/schemas/Instant', description: The end of its Day (J130); an expired Plan cannot
            be confirmed.}
        revision: {type: integer, minimum: 0}
        created_at: {$ref: '#/components/schemas/Instant'}
    PlanBlocking:
      type: object
      required: [limit]
      properties:
        limit:
          type: string
          examples: [carbohydrate_max_pct]
        value: {$ref: '#/components/schemas/ExactNumber'}
        message_key: {type: string}
    PlanChange:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [raise_limit, lower_limit, use_unit, allow_count]
        limit: {type: string}
        to_value: {$ref: '#/components/schemas/ExactNumber'}
        unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
        label: {type: string}
    PlanCommand:
      type: object
      required: [command_id, expected_revision]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_revision: {type: integer, minimum: 0}
      additionalProperties: false
    PlanConstraints:
      type: object
      description: Limits withheld in tracking-only mode cannot be sent (J110).
      properties:
        calorie_aim_kcal: {$ref: '#/components/schemas/ExactNumber', description: 'Pre-filled with what is left today, lowered
            to the ceiling (J132).'}
        calorie_aim_tolerance_pct: {$ref: '#/components/schemas/Decimal'}
        calorie_ceiling_kcal: {$ref: '#/components/schemas/ExactNumber'}
        carbohydrate_max_pct: {$ref: '#/components/schemas/Decimal', description: 'On macro energy, 4/4/9.'}
        protein_min_g: {$ref: '#/components/schemas/ExactNumber'}
        protein_min_pct: {$ref: '#/components/schemas/Decimal'}
        exclusions:
          type: array
          items: {type: string}
        must_include:
          type: array
          items:
            type: object
            required: [unit_version_id, min_count]
            properties:
              unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
              min_count: {$ref: '#/components/schemas/Count'}
            additionalProperties: false
        preferences:
          type: array
          items:
            type: object
            required: [unit_version_id, share_pct, basis]
            properties:
              unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
              share_pct: {$ref: '#/components/schemas/Decimal'}
              basis:
                type: string
                enum: [count, calories]
            additionalProperties: false
        increments:
          type: string
          enum: [whole, halves, grams]
          description: Whole counts by default (FR-051).
      additionalProperties: false
    PlanCount:
      type: object
      required: [unit_version_id, count]
      properties:
        unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
        count: {$ref: '#/components/schemas/Count'}
      additionalProperties: false
    PlanEdit:
      type: object
      description: Nudge a count or change a limit; every limit is checked again.
      required: [command_id, counts]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        counts:
          type: array
          items: {$ref: '#/components/schemas/PlanCount'}
          minItems: 1
        constraints: {$ref: '#/components/schemas/PlanConstraints'}
      additionalProperties: false
    PlanId:
      type: string
      description: 'A Plan: `plan_` + hex.'
      pattern: ^plan_[0-9a-f]{4,32}$
      examples: [plan_4e20]
    PlanList:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: {$ref: '#/components/schemas/Plan'}
    PlanRequest:
      type: object
      description: Solve meal quantities from foods and constraints (FRD §18).
      required: [command_id, diary_day_id, available, constraints]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        scope:
          type: string
          enum: [meal, day]
          description: '`day` exists only to refuse below the hard stop or floor (J131).'
        available:
          type: array
          items:
            type: object
            required: [unit_version_id]
            properties:
              unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
              available_count: {$ref: '#/components/schemas/Count'}
            additionalProperties: false
          minItems: 1
        constraints: {$ref: '#/components/schemas/PlanConstraints'}
        source_analysis_id: {$ref: '#/components/schemas/AnalysisId'}
        explain: {type: boolean, description: Ask for the plain-language explanation (task Explain; verified numbers only).}
      additionalProperties: false
    PlanState:
      type: string
      enum: [proposed, infeasible, saved, confirmed, not_eaten]
      description: 'Plan: Proposed · Infeasible → Saved → Confirmed · Not eaten; Confirmed → Saved and Not eaten → Saved on
        Undo (J68). Expiry is `expired_at`, not a state (J130).'
    PolicyState:
      type: string
      enum: [proposed, approved, in_effect, superseded]
      description: 'Policy version: Proposed → Approved (with effective-from) → In effect → Superseded.'
    PolicyValues:
      type: object
      description: Every value of the nutrition Policy (seed.md §4.1, J97).
      required: [floor_kcal, hard_stop_kcal, deficit_cap, activity_multiplier, activity_adjusted_credit, macro_split, energy_mismatch,
        retention]
      properties:
        floor_kcal: {$ref: '#/components/schemas/ExactNumber'}
        hard_stop_kcal: {$ref: '#/components/schemas/ExactNumber', description: 'Never below 1,000 (code minimum, J98); the
            floor is never below it.'}
        maintain_pct: {$ref: '#/components/schemas/Decimal'}
        loss:
          type: object
          required: [default_pct, choices_pct]
          properties:
            default_pct: {$ref: '#/components/schemas/Decimal'}
            choices_pct:
              type: array
              items: {$ref: '#/components/schemas/Decimal'}
        gain:
          type: object
          required: [default_pct, choices_pct]
          properties:
            default_pct: {$ref: '#/components/schemas/Decimal'}
            choices_pct:
              type: array
              items: {$ref: '#/components/schemas/Decimal'}
        deficit_cap:
          type: object
          description: The smaller of the two.
          required: [max_pct, max_kcal]
          properties:
            max_pct: {$ref: '#/components/schemas/Decimal'}
            max_kcal: {$ref: '#/components/schemas/ExactNumber'}
        activity_multiplier: {$ref: '#/components/schemas/Decimal'}
        activity_adjusted_credit:
          type: object
          description: The default and the upper bound (J103).
          required: [credit_factor, credit_cap_kcal]
          properties:
            credit_factor: {$ref: '#/components/schemas/Decimal'}
            credit_cap_kcal: {$ref: '#/components/schemas/ExactNumber'}
        macro_split: {$ref: '#/components/schemas/MacroSplit'}
        target_review_days: {type: integer, minimum: 1}
        glp1:
          type: object
          properties:
            protein_min_g_per_kg: {$ref: '#/components/schemas/Decimal'}
            protein_max_g_per_kg: {$ref: '#/components/schemas/Decimal'}
            added_deficit: {type: boolean}
        tracking_only:
          type: object
          properties:
            scoff_cutoff: {type: integer, minimum: 0}
            pregnancy: {type: boolean}
            breastfeeding: {type: boolean}
            withheld_limits:
              type: array
              items:
                type: string
                enum: [calorie_aim, calorie_ceiling, carbohydrate_max]
            guidance_wording: {$ref: '#/components/schemas/TextVersion'}
        energy_mismatch:
          type: object
          description: Both must be exceeded, per actual serving.
          required: [min_pct, min_kcal]
          properties:
            min_pct: {$ref: '#/components/schemas/Decimal'}
            min_kcal: {$ref: '#/components/schemas/ExactNumber'}
        component_sum_tolerance:
          type: object
          description: The larger of pct of the total and the scale's step (J74).
          properties:
            pct: {$ref: '#/components/schemas/Decimal'}
            or_scale_step: {type: boolean}
        planner_increments:
          type: string
          enum: [whole, halves, grams]
        clarification_limit: {type: integer, minimum: 0, maximum: 2}
        carbohydrate_labels:
          type: object
          properties:
            low_below_pct: {$ref: '#/components/schemas/Decimal'}
            high_above_pct: {$ref: '#/components/schemas/Decimal'}
        suggested_target:
          type: object
          properties:
            min_days: {type: integer, minimum: 1}
            min_complete_days: {type: integer, minimum: 1}
            min_weights: {type: integer, minimum: 1}
            max_change_kcal: {$ref: '#/components/schemas/ExactNumber'}
            review_days: {type: integer, minimum: 1}
        retention:
          type: object
          description: 'Inside the published bounds: may be shortened, never lengthened (J26).'
          properties:
            raw_scan_days: {type: integer, minimum: 1, maximum: 30}
            audio_hours: {type: integer, minimum: 1, maximum: 24}
    PolicyVersion:
      type: object
      required: [version, state, values]
      properties:
        version: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/PolicyState'}
        values: {$ref: '#/components/schemas/PolicyValues'}
        based_on: {type: integer, minimum: 1}
        proposed_by: {$ref: '#/components/schemas/StaffId'}
        proposed_at: {$ref: '#/components/schemas/Instant'}
        approved_by: {$ref: '#/components/schemas/StaffId'}
        approved_at: {$ref: '#/components/schemas/Instant'}
        sole_holder: {type: boolean, description: 'The approver role had one holder, so proposer = approver was allowed and
            recorded.'}
        reason: {type: string}
        effective_from: {$ref: '#/components/schemas/Instant'}
    PolicyVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items: {$ref: '#/components/schemas/PolicyVersion'}
    Price:
      type: object
      description: A row in effect never changes.
      required: [price_id, model_id, input_usd_per_mtok, output_usd_per_mtok, effective_from]
      properties:
        price_id: {type: string}
        model_id: {type: string}
        input_usd_per_mtok: {$ref: '#/components/schemas/Decimal'}
        output_usd_per_mtok: {$ref: '#/components/schemas/Decimal'}
        effective_from: {$ref: '#/components/schemas/Instant'}
        effective_to: {$ref: '#/components/schemas/Instant'}
        source: {type: string}
        added_by: {type: string}
        added_at: {$ref: '#/components/schemas/Instant'}
    PriceIn:
      type: object
      required: [command_id, model_id, input_usd_per_mtok, output_usd_per_mtok, effective_from, source]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        model_id: {type: string, maxLength: 80}
        input_usd_per_mtok: {$ref: '#/components/schemas/Decimal'}
        output_usd_per_mtok: {$ref: '#/components/schemas/Decimal'}
        effective_from: {$ref: '#/components/schemas/Instant'}
        source: {type: string, maxLength: 200}
      additionalProperties: false
    PriceList:
      type: object
      required: [prices]
      properties:
        prices:
          type: array
          items: {$ref: '#/components/schemas/Price'}
    PrivacyJob:
      type: object
      description: A Privacy job (E13).
      required: [job_id, kind, state, requested_at]
      properties:
        job_id: {$ref: '#/components/schemas/PrivacyJobId'}
        kind: {$ref: '#/components/schemas/PrivacyJobKind'}
        state: {$ref: '#/components/schemas/JobState'}
        purpose: {$ref: '#/components/schemas/Purpose', description: Consent withdrawal only.}
        reference: {$ref: '#/components/schemas/DeletionReference'}
        requested_at: {$ref: '#/components/schemas/Instant'}
        due_by: {$ref: '#/components/schemas/Instant', description: + 30 days.}
        requested_by:
          type: string
          enum: [eater, staff]
        channel:
          type: string
          enum: [in_app, outside_app]
        verified_by:
          type: string
          enum: [email_link]
        stages:
          type: array
          items: {$ref: '#/components/schemas/JobStage'}
        attempts: {type: integer, minimum: 0, maximum: 5}
        failure_reason: {$ref: '#/components/schemas/FailureReason'}
        size_bytes: {type: integer, minimum: 0}
        counts: {$ref: '#/components/schemas/ExportCounts'}
        window_until: {$ref: '#/components/schemas/Instant', description: 'Export: downloadable 7 days (J140).'}
        downloads: {type: integer, minimum: 0}
        completion_record: {$ref: '#/components/schemas/CompletionRecord'}
    PrivacyJobId:
      type: string
      description: 'A Privacy job: `job_exp_` (export) · `job_del_` (deletion) · `job_cw_` (Consent withdrawal) + digits.'
      pattern: ^job_(exp|del|cw)_[0-9]+$
      examples: [job_del_2215]
    PrivacyJobKind:
      type: string
      enum: [export, deletion, consent_withdrawal]
    PrivacyJobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: {$ref: '#/components/schemas/PrivacyJob'}
    PrivacyRequest:
      type: object
      required: [command_id, kind]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        kind:
          type: string
          enum: [export, deletion]
        warning_acknowledged: {type: boolean, description: 'Deletion: the one clear warning was confirmed (eater-9.18).'}
      additionalProperties: false
    PromptIn:
      type: object
      description: A prompt is checked like input from a stranger (admin-10.11).
      required: [command_id, text]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        text: {type: string, minLength: 1}
        note: {type: string, maxLength: 200}
      additionalProperties: false
    PromptVersion:
      type: object
      required: [task, version, text]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        version: {type: integer, minimum: 1}
        text: {type: string}
        saved_by: {type: string}
        saved_at: {$ref: '#/components/schemas/Instant'}
    ProposeAlias:
      type: object
      description: One word cannot mean two foods in one dialect (approver-10.43, VALIDATION_ERROR).
      required: [command_id, text, dialect, target]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        text: {type: string, minLength: 1, maxLength: 80}
        transliteration: {type: string, maxLength: 80}
        language: {$ref: '#/components/schemas/Language'}
        dialect: {$ref: '#/components/schemas/Dialect'}
        target:
          type: object
          required: [kind, id]
          properties:
            kind: {$ref: '#/components/schemas/ReferenceKind'}
            id: {type: string}
          additionalProperties: false
        reason: {type: string, maxLength: 200}
      additionalProperties: false
    ProposeFood:
      type: object
      description: Checks run on every save; the licence gate refuses an unlicensed source (approver-10.25, 10.26).
      required: [command_id, name_en, basis_amount, basis_unit, nutrients, licence]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        food_id: {$ref: '#/components/schemas/FoodId', description: Absent for a new Food; present for version n+1.}
        name_en: {type: string, maxLength: 120}
        name_ar: {type: string, maxLength: 120}
        source_id: {type: string}
        source_url: {type: string, format: uri}
        basis_amount: {$ref: '#/components/schemas/ExactNumber'}
        basis_unit:
          type: string
          enum: [g, ml, serving, piece]
        density_g_per_ml: {$ref: '#/components/schemas/ExactNumber'}
        nutrients: {$ref: '#/components/schemas/NutrientVector'}
        value_basis:
          type: object
          properties:
            energy_kcal: {$ref: '#/components/schemas/ValueBasis'}
            protein_g: {$ref: '#/components/schemas/ValueBasis'}
            carbohydrate_g: {$ref: '#/components/schemas/ValueBasis'}
            fat_g: {$ref: '#/components/schemas/ValueBasis'}
            fiber_g: {$ref: '#/components/schemas/ValueBasis'}
            sugars_g: {$ref: '#/components/schemas/ValueBasis'}
        preparation: {type: string, maxLength: 120}
        licence: {type: string, maxLength: 200}
        evidence_ids:
          type: array
          items: {type: string}
        cross_checks:
          type: array
          items: {$ref: '#/components/schemas/CrossCheck'}
        reason: {type: string, maxLength: 200}
      additionalProperties: false
    ProposePolicy:
      type: object
      required: [command_id, based_on, values]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        based_on: {type: integer, description: The version this edits; not the newest → 409 STALE_REVISION (approver-10.60).,
          minimum: 1}
        values: {$ref: '#/components/schemas/PolicyValues'}
        guidance_en: {type: string}
        guidance_ar: {type: string}
        reason: {type: string, maxLength: 200}
      additionalProperties: false
    ProposeRegistryVersion:
      type: object
      description: The schema version comes from code (admin-10.10).
      required: [command_id, model_id, prompt_version, reason]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        model_id: {type: string, maxLength: 80}
        prompt_version: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 200}
      additionalProperties: false
    ProposeTierBRecipe:
      type: object
      description: Nested records stay acyclic (approver-10.37).
      required: [command_id, dialect, name_ar, ingredients]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        record_id: {$ref: '#/components/schemas/TierBRecipeRecordId'}
        dialect: {$ref: '#/components/schemas/Dialect'}
        name_ar: {type: string, maxLength: 120}
        name_en: {type: string, maxLength: 120}
        ingredients:
          type: array
          items:
            type: object
            required: [food_id, version, mass_g]
            properties:
              food_id: {$ref: '#/components/schemas/FoodId'}
              version: {type: integer, minimum: 1}
              mass_g: {$ref: '#/components/schemas/ExactNumber'}
            additionalProperties: false
          minItems: 1
        additions:
          type: array
          items:
            type: object
            properties:
              food_id: {$ref: '#/components/schemas/FoodId'}
              version: {type: integer, minimum: 1}
              mass_g: {$ref: '#/components/schemas/ExactNumber'}
            additionalProperties: false
        discards:
          type: array
          items:
            type: object
            properties:
              food_id: {$ref: '#/components/schemas/FoodId'}
              version: {type: integer, minimum: 1}
              mass_g: {$ref: '#/components/schemas/ExactNumber'}
            additionalProperties: false
        cooked_yield_g: {$ref: '#/components/schemas/ExactNumber'}
        evidence_ids:
          type: array
          items: {type: string}
        cross_checks:
          type: array
          items: {$ref: '#/components/schemas/CrossCheck'}
        reason: {type: string, maxLength: 200}
      additionalProperties: false
    PublishWording:
      type: object
      description: 'Publish a Wording version; the previous version of the family becomes Superseded. A consent text whose
        privacy review is not signed on Settings › launch gates is 409 VALIDATION_ERROR `reason: privacy_review_not_signed`
        with the gate''s state (J26, J149).'
      required: [command_id, text_version, en, ar, asks_again]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        text_version: {$ref: '#/components/schemas/TextVersion', description: 'The version to publish, e.g. `c-ai-5` (its
            family and number are read from it).'}
        en: {type: string, minLength: 1}
        ar: {type: string, minLength: 1}
        asks_again: {type: boolean, description: Ask eaters who decided under an earlier version again (J154).}
      additionalProperties: false
    Purpose:
      type: string
      enum: [diary_processing, ai_processing, health_read_workouts, health_read_active_energy, health_read_body_mass, health_write_food,
        microphone, photos, research, label_review]
      description: The ten Consent purposes, one Consent each (J23).
    PurposeConsent:
      type: object
      required: [purpose, state, text_version_in_force]
      properties:
        purpose: {$ref: '#/components/schemas/Purpose'}
        state: {$ref: '#/components/schemas/ConsentState'}
        record: {$ref: '#/components/schemas/ConsentRecord'}
        text_version_in_force: {$ref: '#/components/schemas/TextVersion'}
        asks_again: {type: boolean, description: 'The Wording in force carries `asks_again` and the eater''s record is under
            an earlier version: the purpose is blocked (CONSENT_REQUIRED) until they give or decline it again (J154).'}
    QualityMetrics:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: {$ref: '#/components/schemas/MetricRow'}
    QuotaLimits:
      type: object
      required: [hard]
      properties:
        soft: {type: integer, minimum: 0}
        hard: {type: integer, minimum: 0}
      additionalProperties: false
    QuotasIn:
      type: object
      required: [command_id, expected_version, signed_in, anonymous, reason]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_version: {type: integer, minimum: 1}
        signed_in:
          type: object
          required: [image, text_voice_explain]
          properties:
            image: {$ref: '#/components/schemas/QuotaLimits'}
            text_voice_explain: {$ref: '#/components/schemas/QuotaLimits'}
          additionalProperties: false
        anonymous:
          type: object
          required: [image, text_voice_explain]
          properties:
            image: {$ref: '#/components/schemas/QuotaLimits'}
            text_voice_explain: {$ref: '#/components/schemas/QuotaLimits'}
          additionalProperties: false
        reason: {type: string, minLength: 1, maxLength: 200}
      additionalProperties: false
    QuotasVersion:
      type: object
      description: Per diary day (J91); repeat logs never count.
      required: [version, state, signed_in, anonymous]
      properties:
        version: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/ConfigVersionState'}
        signed_in:
          type: object
          required: [image, text_voice_explain]
          properties:
            image: {$ref: '#/components/schemas/QuotaLimits'}
            text_voice_explain: {$ref: '#/components/schemas/QuotaLimits'}
        anonymous:
          type: object
          required: [image, text_voice_explain]
          properties:
            image: {$ref: '#/components/schemas/QuotaLimits'}
            text_voice_explain: {$ref: '#/components/schemas/QuotaLimits'}
        saved_by: {type: string}
        saved_at: {$ref: '#/components/schemas/Instant'}
        reason: {type: string}
    QuotaUsage:
      type: object
      required: [subject_id, diary_day_id, quotas_version, image_count, text_count]
      properties:
        subject_id: {$ref: '#/components/schemas/SubjectId'}
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId'}
        quotas_version: {type: integer, minimum: 1}
        image_count: {type: integer, minimum: 0}
        text_count: {type: integer, minimum: 0}
        image_soft_reached: {type: boolean}
        image_hard_reached: {type: boolean}
        resets_at: {$ref: '#/components/schemas/Instant'}
    Reasoned:
      type: object
      required: [command_id, reason]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        reason: {type: string, minLength: 1, maxLength: 200}
      additionalProperties: false
    Recipe:
      type: object
      required: [recipe_id, name, state, current_version]
      properties:
        recipe_id: {$ref: '#/components/schemas/RecipeId'}
        name: {type: string}
        state: {$ref: '#/components/schemas/UnitState'}
        current_version: {type: integer, minimum: 1}
        latest: {$ref: '#/components/schemas/RecipeVersion'}
    RecipeId:
      type: string
      description: 'An eater''s Recipe: `unit_<owner>_<name>` (a Unit with `structure: recipe`).'
      pattern: ^unit_[a-z0-9_]+$
      examples: [unit_mona_talbina]
    RecipeIngredient:
      type: object
      required: [food_version_id, mass_g]
      properties:
        food_version_id: {$ref: '#/components/schemas/FoodVersionId'}
        mass_g: {$ref: '#/components/schemas/ExactNumber'}
      additionalProperties: false
    RecipeList:
      type: object
      required: [recipes]
      properties:
        recipes:
          type: array
          items: {$ref: '#/components/schemas/Recipe'}
    RecipeVersion:
      type: object
      required: [recipe_id, recipe_version_id, version, ingredients, assumptions, created_at]
      properties:
        recipe_id: {$ref: '#/components/schemas/RecipeId'}
        recipe_version_id: {$ref: '#/components/schemas/UnitVersionId'}
        version: {type: integer, minimum: 1}
        ingredients:
          type: array
          items: {$ref: '#/components/schemas/RecipeIngredient'}
        additions:
          type: array
          items: {$ref: '#/components/schemas/RecipeIngredient'}
        discards:
          type: array
          items: {$ref: '#/components/schemas/RecipeIngredient'}
        cooked_yield_g: {$ref: '#/components/schemas/ExactNumber'}
        nutrient_vector_per_100g: {$ref: '#/components/schemas/NutrientVector'}
        range_per_100g:
          type: object
          description: Present instead of an exact figure when the pot or the oil is unknown (eater-2.32).
          properties:
            low: {$ref: '#/components/schemas/NutrientVector'}
            high: {$ref: '#/components/schemas/NutrientVector'}
        assumptions:
          type: array
          items: {type: string}
          description: Unresolved assumptions (FRD §18).
        evidence: {$ref: '#/components/schemas/Evidence'}
        created_at: {$ref: '#/components/schemas/Instant'}
    RecipeVersionSaved:
      type: object
      description: Calculated nutrients and unresolved assumptions (FRD §18).
      required: [recipe, version]
      properties:
        recipe: {$ref: '#/components/schemas/Recipe'}
        version: {$ref: '#/components/schemas/RecipeVersion'}
    RecordGate:
      type: object
      required: [command_id, result]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        result: {type: string, maxLength: 200}
        version_reviewed: {type: string, maxLength: 40}
        next_check_due: {$ref: '#/components/schemas/DiaryDayId'}
      additionalProperties: false
    RecordsOfProcessing:
      type: object
      description: Derived from live, versioned configuration (J20).
      required: [purposes]
      properties:
        purposes:
          type: array
          items:
            type: object
            required: [purpose, text_version]
            properties:
              purpose: {$ref: '#/components/schemas/Purpose'}
              text_version: {$ref: '#/components/schemas/TextVersion'}
              retention: {type: string}
              processors:
                type: array
                items: {type: string}
        residency: {type: string}
        controller_contact:
          type: string
          examples: [Not recorded in the product]
        dpo:
          type: string
          examples: [Not recorded in the product]
        security_measures:
          type: string
          examples: [Not recorded in the product]
    ReferenceKind:
      type: string
      enum: [food, tier_b_recipe_record]
    ReferenceState:
      type: string
      enum: [proposed, in_review, approved, rejected, superseded, retired]
      description: 'Food / Tier B recipe record / Alias: Proposed → In review → Approved · Rejected; Approved → Superseded
        · Retired.'
    RegistryOverview:
      type: object
      description: What is live, in one look (admin-10.1).
      required: [tasks, models, quotas]
      properties:
        tasks:
          type: array
          items: {$ref: '#/components/schemas/RegistryTask'}
          minItems: 7
          maxItems: 7
        models:
          type: array
          items: {$ref: '#/components/schemas/Model'}
        quotas: {$ref: '#/components/schemas/QuotasVersion'}
        spend_cap: {$ref: '#/components/schemas/AiSpendCap'}
        banner: {type: string, description: e.g. a roll-back banner until dismissed.}
    RegistryState:
      type: string
      enum: [proposed, shadow, canary, rollout, replaced, rolled_back]
      description: 'Registry version: Proposed → Shadow → Canary → Rollout → Replaced · Rolled back (J67).'
    RegistryTask:
      type: object
      required: [task, name, kill_switch, rollout_version, location, revision]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        name: {type: string}
        kill_switch: {$ref: '#/components/schemas/KillSwitch'}
        cause:
          type: string
          enum: [manual, spend_cap]
        kill_reason: {type: string}
        rollout_version: {$ref: '#/components/schemas/RegistryVersionRef'}
        canary_version: {$ref: '#/components/schemas/RegistryVersionRef'}
        canary_share_pct: {$ref: '#/components/schemas/Decimal'}
        shadow_version: {$ref: '#/components/schemas/RegistryVersionRef'}
        rollback_target: {$ref: '#/components/schemas/RegistryVersionRef', description: The most recent Replaced version (J67).}
        location: {type: string, description: Read-only (J96).}
        revision: {type: integer, minimum: 0}
        versions:
          type: array
          items: {$ref: '#/components/schemas/RegistryVersion'}
    RegistryVersion:
      type: object
      required: [ref, task, version, state, model_id, prompt_version, schema_version]
      properties:
        ref: {$ref: '#/components/schemas/RegistryVersionRef'}
        task: {$ref: '#/components/schemas/Task'}
        version: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/RegistryState'}
        model_id: {type: string}
        prompt_version: {type: integer, minimum: 1}
        schema_version: {type: integer, minimum: 1, description: 'From code, never the console (admin-10.10).'}
        stage_history:
          type: array
          items: {$ref: '#/components/schemas/StageMove'}
        evaluation_run_ids:
          type: array
          items: {type: string}
        canary_checks:
          type: array
          items: {$ref: '#/components/schemas/CanaryCheck'}
        proposed_by: {type: string}
        reason: {type: string}
    RegistryVersionRef:
      type: string
      description: A Registry version `<task>@v<n>`.
      pattern: ^(meal|label|scale|ingredients|text|voice|explain)@v[0-9]+$
      examples: [meal@v6]
    RegressionCase:
      type: object
      description: A consented copy (research Given), never the eater's media (J28).
      required: [case_number, task]
      properties:
        case_number: {type: string}
        task: {$ref: '#/components/schemas/Task'}
        media_url: {type: string, format: uri, description: Short-lived signed copy.}
        reference_values: {$ref: '#/components/schemas/NutrientVector'}
        added_at: {$ref: '#/components/schemas/Instant'}
    RetentionRunDetail:
      type: object
      description: The detail of the `audit_trail.retention_run` event (hourly, events older than 5 years; J18, J149).
      required: [removed_through_seq, anchor_hash, roles_held_at_anchor]
      properties:
        removed_through_seq: {type: integer, minimum: 0, description: The highest removed `seq` (D6-A4).}
        anchor_hash: {type: string, pattern: '^[0-9a-f]{64}$', description: 'The `prev_hash` of the first kept event: the
            chain check starts from it (D6-A4).'}
        roles_held_at_anchor:
          type: array
          items:
            type: object
            required: [holder, roles]
            properties:
              holder:
                type: string
                examples: [staff_ali]
              roles:
                type: array
                items: {type: string}
          description: Each user's roles at the anchor, so role history stays provable (J157).
    RetireCommand:
      type: object
      required: [command_id, reason]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        reason: {type: string, minLength: 1, maxLength: 200}
        defective: {type: boolean, description: 'Defective: the eater''s notice lists affected past Days (J80).'}
      additionalProperties: false
    RetryJob:
      type: object
      description: Same job id; a second support retry of an export is 409 `already_retried` (J35).
      required: [command_id]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        reason: {type: string, maxLength: 200}
      additionalProperties: false
    ReviewCommand:
      type: object
      description: Approve, reject or claim a version; `expected_state` makes two approvers at once a 409 (approver-10.9).
      required: [command_id]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_state: {$ref: '#/components/schemas/ReferenceState'}
        reason: {type: string, maxLength: 200}
      additionalProperties: false
    ReviewNote:
      type: object
      description: 'The Auditor''s one write (J17): `audit_trail.review_noted` with detail `scope`, `period`, `finding`, `note`
        and no other key.'
      required: [command_id, scope, period, finding]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        scope: {type: string, description: 'What was reviewed, e.g. "grant_31f0 · events 196, 198–201, 205–207". Refused 422
            `scope` when it holds an account id (`acct_…`) or an email address (D6-A3); Grant ids, case references and event
            numbers are allowed.', minLength: 1, maxLength: 200}
        period:
          type: object
          description: The period reviewed, entered in the Auditor's zone.
          required: [from, to]
          properties:
            from: {$ref: '#/components/schemas/Instant'}
            to: {$ref: '#/components/schemas/Instant'}
          additionalProperties: false
        finding:
          type: string
          enum: [no_issue, issue_found, needs_follow_up]
          description: No issue found · Issue found · Needs follow-up (D6-A2); missing is 422 `finding`.
        note: {type: string, description: 'Optional free text, ≤ 500 characters, no eater identifier: refused 422 `note` like
            `scope` (J17, D6-A3).', maxLength: 500}
      additionalProperties: false
    Role:
      type: object
      required: [role_id, name, permissions, seeded, version]
      properties:
        role_id:
          type: string
          examples: [role_support_agent]
        name: {type: string}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
        seeded: {type: boolean, description: Seeded roles are read-only.}
        version: {type: integer, minimum: 1}
        created_by: {type: string}
        reason: {type: string}
    RoleAssignment:
      type: object
      required: [assignment_id, staff_id, role_id, assigned_at, assigned_by]
      properties:
        assignment_id: {type: string}
        staff_id: {$ref: '#/components/schemas/StaffId'}
        role_id: {type: string}
        role_name: {type: string}
        assigned_at: {$ref: '#/components/schemas/Instant'}
        assigned_by:
          type: string
          examples: ['system:deployment']
        reason: {type: string}
        removed_at: {$ref: '#/components/schemas/Instant'}
        removed_by: {type: string}
    RoleList:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
    RollbackVersion:
      type: object
      required: [command_id, expected_revision, reason]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        expected_revision: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 200}
      additionalProperties: false
    SafetyMode:
      type: string
      enum: [standard, tracking_only, protein_first]
      description: The mode the safety screen sets (never the answers, J109).
    SaveFoodRule:
      type: object
      required: [command_id, scope, predicate]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        rule_id: {type: string, description: Absent for a new rule.}
        expected_revision: {type: integer, minimum: 1}
        scope:
          type: string
          enum: [household_default, named_variant]
        predicate: {type: string, maxLength: 120}
        component: {$ref: '#/components/schemas/UnitComponent'}
        default: {type: string, maxLength: 120}
      additionalProperties: false
    SaveRecipe:
      type: object
      description: Save a Recipe with yield and ingredients (FRD §18).
      required: [command_id, name, ingredients]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        name: {type: string, minLength: 1, maxLength: 60}
        ingredients:
          type: array
          items: {$ref: '#/components/schemas/RecipeIngredient'}
          minItems: 1
        additions:
          type: array
          items: {$ref: '#/components/schemas/RecipeIngredient'}
        discards:
          type: array
          items: {$ref: '#/components/schemas/RecipeIngredient'}
        cooked_yield_g: {$ref: '#/components/schemas/ExactNumber', description: 'The weighed pot; absent → a range, not an
            exact figure.'}
      additionalProperties: false
    SaveRole:
      type: object
      required: [command_id, name, permissions, reason]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        name: {type: string, minLength: 1, maxLength: 60}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
          uniqueItems: true
        expected_version: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 200}
      additionalProperties: false
    SaveTemplate:
      type: object
      required: [command_id, name, items]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        name: {type: string, minLength: 1, maxLength: 60}
        meal_name: {type: string, maxLength: 40}
        items:
          type: array
          items: {$ref: '#/components/schemas/TemplateItem'}
          minItems: 1
      additionalProperties: false
    SaveUnit:
      type: object
      description: 'Save unit (FRD §18 POST /v1/units): a simple or composite Unit, version 1.'
      required: [command_id, name, unit_kind, structure]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        name: {type: string, minLength: 1, maxLength: 60}
        other_names:
          type: array
          items: {type: string, maxLength: 60}
          maxItems: 20
        unit_kind: {$ref: '#/components/schemas/UnitKind'}
        kind_label: {type: string, maxLength: 30}
        structure:
          type: string
          enum: [simple, composite]
        components:
          type: array
          items: {$ref: '#/components/schemas/UnitComponent'}
          minItems: 1
        measured_total_g: {$ref: '#/components/schemas/ExactNumber', description: 'The weighed total a Composite''s parts
            must add up to (MASS_BALANCE_ERROR, J74).'}
        measurement_evidence:
          type: array
          items: {$ref: '#/components/schemas/MeasurementEvidence'}
        variant_of: {$ref: '#/components/schemas/UnitId'}
        user_override:
          type: object
          description: 'Calories only: Evidence user-defined (eater-2.34).'
          required: [energy_kcal]
          properties:
            energy_kcal: {$ref: '#/components/schemas/ExactNumber'}
          additionalProperties: false
        source_analysis_id: {$ref: '#/components/schemas/AnalysisId'}
      additionalProperties: false
    SessionEndReason:
      type: string
      enum: [sign_out, idle, role_removed]
    SetRoles:
      type: object
      description: Refused 422 VALIDATION_ERROR with `role.change_refused` for a self-change, the last Platform admin, separated
        duties, an eater account or a seeded role (J36, J41).
      required: [command_id, role_ids, reason]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        role_ids:
          type: array
          items: {type: string}
          uniqueItems: true
        expected_revision: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 200}
      additionalProperties: false
    SetSafetyMode:
      type: object
      description: The resulting mode only — never the answers (J109).
      required: [command_id, mode, screen_version]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        mode: {$ref: '#/components/schemas/SafetyMode'}
        screen_version: {type: string, maxLength: 20}
      additionalProperties: false
    Shares:
      type: object
      description: Macro shares, unrounded, with the shown figures. Absent when the macros are incomplete (MACROS_INCOMPLETE
        is never raised for a report; coverage is reported instead).
      required: [basis, protein_pct, carbohydrate_pct, fat_pct, shown]
      properties:
        basis:
          type: string
          enum: [macro_energy]
          description: Shares are of macro-derived energy, 4/4/9 (FRD §10).
        protein_pct: {$ref: '#/components/schemas/ExactNumber'}
        carbohydrate_pct: {$ref: '#/components/schemas/ExactNumber'}
        fat_pct: {$ref: '#/components/schemas/ExactNumber'}
        shown:
          type: object
          description: 'The display figures: largest remainder to one decimal place, summing to 100.0 (`nutrition_core.shares.largest_remainder`).'
          properties:
            protein_pct: {$ref: '#/components/schemas/Decimal'}
            carbohydrate_pct: {$ref: '#/components/schemas/Decimal'}
            fat_pct: {$ref: '#/components/schemas/Decimal'}
    SignedUrl:
      type: object
      description: Short-lived signed access (FR-077).
      required: [url, expires_at]
      properties:
        url: {type: string, format: uri}
        expires_at: {$ref: '#/components/schemas/Instant'}
    SignGate:
      type: object
      required: [command_id, version_reviewed, signer_name]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        version_reviewed: {type: string, maxLength: 40}
        signer_name: {type: string, maxLength: 80}
        note: {type: string, maxLength: 200}
      additionalProperties: false
    SignOut:
      type: object
      required: [command_id]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
      additionalProperties: false
    SolutionStatus:
      type: string
      enum: [feasible, infeasible, unknown]
      description: 'Solver result: `unknown` = no answer in time, and no Plan is made (J68).'
    SpendCapIn:
      type: object
      required: [command_id, alert_usd, cap_usd, reason]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        alert_usd: {$ref: '#/components/schemas/Decimal'}
        cap_usd: {$ref: '#/components/schemas/Decimal'}
        reason: {type: string, minLength: 1, maxLength: 200}
      additionalProperties: false
    StaffId:
      type: string
      description: A staff account `staff_<name>` — never an eater account (D2).
      pattern: ^staff_[a-z][a-z_]*$
      examples: [staff_mona]
    StaffSession:
      type: object
      required: [staff_id, display_name, roles, permissions, csrf_token, idle_expires_at]
      properties:
        staff_id: {$ref: '#/components/schemas/StaffId'}
        display_name:
          type: string
          examples: [Mona K.]
        roles:
          type: array
          items: {type: string}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
        csrf_token: {type: string, description: Send as `X-CSRF-Token` on every console mutation.}
        idle_expires_at: {$ref: '#/components/schemas/Instant', description: '15 minutes idle, warning at 13 (J2).'}
        console_language: {$ref: '#/components/schemas/Language'}
        console_time_zone: {$ref: '#/components/schemas/TimeZone'}
    StaffSignIn:
      type: object
      description: Password + a 6-digit authenticator code. 5 failures in 15 min lock 15 min.
      required: [command_id, email, password, authenticator_code]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 1}
        authenticator_code: {type: string, pattern: '^[0-9]{6}$'}
      additionalProperties: false
    StageMove:
      type: object
      required: [from, to, at]
      properties:
        from: {$ref: '#/components/schemas/RegistryState'}
        to: {$ref: '#/components/schemas/RegistryState'}
        share_pct: {$ref: '#/components/schemas/Decimal'}
        auto: {type: boolean}
        reason: {type: string}
        by: {type: string}
        at: {$ref: '#/components/schemas/Instant'}
    StageState:
      type: string
      enum: [requested, running, completed, failed, not_applicable]
      description: 'A Privacy job stage: the Job words, or Not applicable (J141).'
    StartDayCommand:
      type: object
      required: [command_id, diary_day_id]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        diary_day_id: {$ref: '#/components/schemas/DiaryDayId', description: 'The next Day, opened early (J117).'}
      additionalProperties: false
    StartEvaluation:
      type: object
      required: [command_id, version]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        version: {type: integer, minimum: 1}
      additionalProperties: false
    SubjectId:
      type: string
      description: An eater account (`acct_` + 6 hex) or an Anonymous session (`acct_anon_` + 4 hex, J124).
      pattern: ^acct_([0-9a-f]{6}|anon_[0-9a-f]{4})$
      examples: [acct_anon_71f2]
    SuggestedTarget:
      type: object
      description: A bounded Suggested Target (P1, FR-060/061).
      required: [suggestion_id, change_kcal, reason, review_period]
      properties:
        suggestion_id:
          type: string
          examples: [sug_8a31]
        change_kcal: {$ref: '#/components/schemas/ExactNumber'}
        reason: {type: string}
        review_period:
          type: object
          properties:
            start: {$ref: '#/components/schemas/DiaryDayId'}
            end: {$ref: '#/components/schemas/DiaryDayId'}
        outcome:
          type: string
          enum: [accepted, kept]
        target_version_id: {$ref: '#/components/schemas/TargetVersionId'}
        created_at: {$ref: '#/components/schemas/Instant'}
    SuggestionAccepted:
      type: object
      required: [suggestion, target]
      properties:
        suggestion: {$ref: '#/components/schemas/SuggestedTarget'}
        target: {$ref: '#/components/schemas/TargetVersion'}
    SuggestionAnswer:
      type: object
      description: '`suggestion` absent when none is offered.'
      properties:
        suggestion: {$ref: '#/components/schemas/SuggestedTarget'}
    SuggestionCommand:
      type: object
      description: Accept or keep a Suggested Target.
      required: [command_id]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
      additionalProperties: false
    SupportCode:
      type: object
      required: [code, issued_at, valid_until]
      properties:
        code: {$ref: '#/components/schemas/SupportCodeValue'}
        issued_at: {$ref: '#/components/schemas/Instant'}
        valid_until: {$ref: '#/components/schemas/Instant', description: 24 h.}
    SupportCodeValue:
      type: string
      description: Support code `SB-XXXX-XXXX` (alphabet without 0, O, 1, I).
      pattern: ^SB-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$
      examples: [SB-7KQ2-94XM]
    SyncRow:
      type: object
      required: [command_id, kind, at]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        kind:
          type: string
          enum: [conflict, duplicates_ignored]
        code:
          type: string
          enum: [UNIT_NOT_FOUND, UNIT_AMBIGUOUS, STALE_REVISION, SOURCE_BASIS_UNKNOWN, MASS_BALANCE_ERROR, MACROS_INCOMPLETE,
            PLAN_INFEASIBLE, AI_UNAVAILABLE, RATE_LIMITED, VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONSENT_REQUIRED,
            AGE_REQUIREMENT, POLICY_FLOOR, GRANT_REQUIRED, GRANT_NOT_ACTIVE, SERVICE_UNAVAILABLE]
        at: {$ref: '#/components/schemas/Instant'}
        deliveries: {type: integer, minimum: 1}
        status_text_key: {type: string}
    TargetChoice:
      type: object
      required: [goal, intake_target_kcal, intake_target_kcal_shown]
      properties:
        goal:
          type: string
          enum: [lose, maintain, gain]
        step_pct: {$ref: '#/components/schemas/Decimal'}
        intake_target_kcal: {$ref: '#/components/schemas/ExactNumber', description: Unrounded.}
        intake_target_kcal_shown: {$ref: '#/components/schemas/ExactNumber', description: To the nearest 10 kcal — the value
            the eater approves (J102).}
        at_floor: {type: boolean, description: Raised to the floor (J99).}
    TargetInputs:
      type: object
      description: 'Onboarding inputs. Not a command: proposals write nothing (and age, height and weight are kept only in
        the approved Target''s input snapshot).'
      required: [age, height_cm, weight_kg, sex_constant]
      properties:
        age: {type: integer, minimum: 18, maximum: 120}
        height_cm: {$ref: '#/components/schemas/ExactNumber'}
        weight_kg: {$ref: '#/components/schemas/ExactNumber'}
        sex_constant:
          type: integer
          description: 'The Mifflin–St Jeor constant chosen by the eater: 5 or −161 (FR-002: never inferred).'
