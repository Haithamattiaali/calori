          type: string
          examples: [tpl_3c01]
        name: {type: string}
        meal_name: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/TemplateItem'}
        created_at: {$ref: '#/components/schemas/Instant'}
    TemplateItem:
      type: object
