        ramadan_days:
          type: object
          properties:
            'on': {type: boolean}
            from_at: {$ref: '#/components/schemas/Instant'}
            to_at: {$ref: '#/components/schemas/Instant'}
        first_day_of_week:
          type: string
          enum: [saturday, sunday, monday]
        one_tap_logging: {type: boolean}
        hide_numbers: {type: boolean}
        show_kcal_on_widgets: {type: boolean}
        food_exclusions:
          type: array
          items: {type: string}
        allow_halves: {type: boolean}
        allow_grams: {type: boolean}
        show_net_carbohydrate: {type: boolean}
        carbohydrate_labels: {type: boolean}
        safety_mode:
          type: object
          properties:
