        rows: {type: integer, minimum: 0}
        parts:
          type: array
          items:
            type: object
            required: [part, rows, sha256]
            properties:
              part: {type: integer, minimum: 1}
              rows: {type: integer, minimum: 0}
              sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
              url: {type: string, format: uri}
