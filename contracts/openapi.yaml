        job_id: {$ref: '#/components/schemas/JobId'}
    UsdaReleaseList:
      type: object
      required: [releases]
      properties:
        releases:
          type: array
          items: {$ref: '#/components/schemas/UsdaRelease'}
    UserProfile:
      type: object
