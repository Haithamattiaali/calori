    TemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: {$ref: '#/components/schemas/Template'}
    TestClock:
      type: object
      required: [now]
      properties:
        now: {$ref: '#/components/schemas/Instant'}
