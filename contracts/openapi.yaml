  /v1/activity/import:
    post:
      operationId: importActivity
      summary: Reconcile permitted Health records
      tags: [activity]
      description: TX-V. One workout from two feeds counts once (AT-22); daily active energy and its workouts are never added
        together. Only purposes with a Given Consent are imported.
      x-module: activity
      x-events: [activity.import_reconciled, activity.confirmed, activity.corrected, activity.voided, weight.recorded]
      x-stories: [eater-7.4, eater-7.7, eater-7.9, eater-7.10]
      security:
      - eaterBearer: []
      parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/AppVersion'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivityImport'}
            examples:
              at22:
                value:
                  command_id: b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e
                  history_starts_at: '2026-08-25T00:00:00Z'
                  workouts:
                  - {provider_record_id: hk_watch_walk_1001, source_name: Apple Watch, kind: walk, start_at: '2026-10-01T03:00:00Z',
                    end_at: '2026-10-01T03:45:00Z', energy_kcal: '210', energy_basis: active, import_revision: 1}
                  - {provider_record_id: hk_runapp_walk_1001, source_name: Running app, kind: walk, start_at: '2026-10-01T03:01:00Z',
                    end_at: '2026-10-01T03:44:00Z', energy_kcal: '205', energy_basis: active, import_revision: 1}
                  - {provider_record_id: hk_watch_walk_1001, source_name: Apple Watch, kind: walk, start_at: '2026-10-01T03:00:00Z',
                    end_at: '2026-10-01T03:45:00Z', energy_kcal: '210', energy_basis: active, import_revision: 1}
                summary: Faisal's walk from the Watch and a running app, sent twice
      x-error-codes:
        '401': [UNAUTHENTICATED]
        '403': [CONSENT_REQUIRED, FORBIDDEN]
        '422': [VALIDATION_ERROR]
        '503': [SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResult'}
              examples:
                at22:
                  value:
                    import_id: imp_faisal_1001
                    ran_at: '2026-10-01T04:30:00Z'
                    accepted: 1
                    updated: 0
                    duplicate: 2
                    conflict: 0
                    activity_days:
                    - diary_day_id: '2026-10-01'
                      eligible_kcal: '210'
                      activity_coverage: {source: apple_health, last_sync_at: '2026-10-01T04:30:00Z', state: data}
                      revision: 1
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
