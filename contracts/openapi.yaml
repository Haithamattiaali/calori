    Evidence:
      type: string
      enum: [user_defined, estimated_analogue, recipe_calculated, label_verified, measured]
      description: The Evidence badge, weakest first (J70).
    EvidenceFile:
      type: object
      required: [evidence_id, kind, sha256]
      properties:
        evidence_id:
          type: string
          examples: [ev_1101]
        kind:
          type: string
          enum: [weighed_ingredients, cooked_yield_weight, label_image, menu_page]
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        licence: {type: string}
        url: {type: string, format: uri, description: Short-lived.}
        expires_at: {$ref: '#/components/schemas/Instant'}
        uploaded_by: {type: string}
        uploaded_at: {$ref: '#/components/schemas/Instant'}
    EvidenceList:
      type: object
      required: [evidence]
      properties:
        evidence:
          type: array
          items: {$ref: '#/components/schemas/EvidenceFile'}
    EvidenceMetrics:
      type: object
      required: [days, rows]
      properties:
        days: {type: integer, minimum: 1}
        rows:
          type: array
          items: {$ref: '#/components/schemas/MetricRow'}
    ExactNumber:
      type: string
      description: 'An exact, unrounded number written as a JSON string: an exact decimal (`"62.5"`), or — when the value
        has no finite decimal — a reduced rational `p/q` (`"187/3"`). Energy (`_kcal`), mass (`_g`, `_kg`), volume (`_ml`)
        and shares carry this type. Never a float; never rounded on the wire (FRD §10.2 rounds only the shown figure).'
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?(/[1-9][0-9]*)?$
      examples: ['46', '62.5', 187/3]
    ExportAuditTrail:
      type: object
      required: [command_id, filters, format]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
        filters:
          type: object
          description: The same filters as the Events view.
          properties: {}
        format:
          type: string
          enum: [csv, json]
        arabic_labels: {type: boolean, description: Add the Arabic label row (J19).}
      additionalProperties: false
    ExportCounts:
      type: object
      description: The console categories (J139).
      properties:
        entries: {type: integer, minimum: 0}
        units: {type: integer, minimum: 0}
        recipes: {type: integer, minimum: 0}
        templates: {type: integer, minimum: 0}
        rules: {type: integer, minimum: 0}
        targets: {type: integer, minimum: 0}
        activity: {type: integer, minimum: 0}
        weights: {type: integer, minimum: 0}
        consents: {type: integer, minimum: 0}
        reports: {type: integer, minimum: 0}
        unit_pictures: {type: integer, minimum: 0}
    FailureReason:
      type: string
      enum: [account_deleted, consent_withdrawn, attempts_exhausted, storage_timeout, processor_timeout, provider_unavailable,
        kill_switch_on]
      description: Why a Job is Failed (J95).
    Flag:
