        unit_id: {$ref: '#/components/schemas/UnitId'}
        name:
          type: string
          examples: [قرصة جبنة]
        other_names:
          type: array
          items: {type: string}
        unit_kind: {$ref: '#/components/schemas/UnitKind'}
        kind_label: {type: string}
        structure: {$ref: '#/components/schemas/UnitStructure'}
        state: {$ref: '#/components/schemas/UnitState'}
        current_version: {type: integer, minimum: 1}
        default_version: {type: integer, minimum: 1}
        variant_of: {$ref: '#/components/schemas/UnitId', description: The without-bread base this Unit is the with-bread
            variant of.}
        has_picture: {type: boolean}
        notices:
          type: array
          items:
            type: string
            enum: [reference_retired, reference_superseded]
          description: '"The reference for this unit was retired — Update unit" (J80).'
        latest: {$ref: '#/components/schemas/UnitVersion'}
    UnitCommand:
      type: object
      description: A command with no other field (archive, unarchive, discard).
      required: [command_id]
      properties:
        command_id: {$ref: '#/components/schemas/CommandId'}
      additionalProperties: false
    UnitComponent:
      type: object
      description: 'One component: exactly one Food version, Recipe version or Unit version (FR-010), by mass, volume (with
        a density, never ml as g) or count.'
      properties:
        food_version_id: {$ref: '#/components/schemas/FoodVersionId'}
        recipe_version_id: {type: string, pattern: '^uv_[a-z0-9_]+_v[0-9]+$', description: A version of one of the eater's
            Recipes.}
        unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
        mass_g: {$ref: '#/components/schemas/ExactNumber'}
        volume_ml: {$ref: '#/components/schemas/ExactNumber'}
        count: {$ref: '#/components/schemas/Count'}
        role:
          type: string
          enum: [part, accompaniment]
          description: '`accompaniment` = bread added by a Food rule (FR-018–FR-022).'
      additionalProperties: false
    UnitDetail:
      type: object
      required: [unit, versions]
      properties:
        unit: {$ref: '#/components/schemas/Unit'}
        versions:
          type: array
          items: {$ref: '#/components/schemas/UnitVersion'}
          description: Every version, newest first.
    UnitId:
      type: string
      description: 'A Unit, Composite or Recipe of one eater: `unit_<owner>_<name>`.'
      pattern: ^unit_[a-z0-9_]+$
      examples: [unit_mona_cheese_bite]
    UnitKind:
      type: string
      enum: [bite, spoonful, sip, cup, piece, slice, handful, custom]
      description: The kind of amount (FR-009, J72); `custom` carries `kind_label`.
    UnitList:
      type: object
      required: [units]
      properties:
        units:
          type: array
          items: {$ref: '#/components/schemas/Unit'}
    UnitMatch:
      type: object
      required: [unit_id, unit_version_id, name, matched_text]
      properties:
        unit_id: {$ref: '#/components/schemas/UnitId'}
        unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
        name: {type: string}
        matched_text: {type: string}
        count: {$ref: '#/components/schemas/Count'}
    UnitNameMatchRequest:
      type: object
      description: 'Typed words to match against the eater''s own Unit names and Aliases (J126). Not a command: it writes
        nothing and calls no model.'
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 500}
        dialect: {$ref: '#/components/schemas/Dialect'}
      additionalProperties: false
    UnitNameMatchResult:
      type: object
      required: [matches, unmatched]
      properties:
        matches:
          type: array
          items: {$ref: '#/components/schemas/UnitMatch'}
        unmatched:
          type: array
          items: {type: string}
    UnitState:
      type: string
