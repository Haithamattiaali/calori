        max_days: {type: integer, minimum: 1, maximum: 14}
        request_window: {$ref: '#/components/schemas/IsoDuration'}
        one_waiting_request: {type: boolean}
        idle_sign_out: {$ref: '#/components/schemas/IsoDuration'}
        idle_warning: {$ref: '#/components/schemas/IsoDuration'}
        email_lookup_limit_per_hour: {type: integer, minimum: 1}
