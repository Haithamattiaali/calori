          properties:
            intact_through_seq: {type: integer, minimum: 0}
            last_checked_at: {$ref: '#/components/schemas/Instant'}
    AuditTrailAction:
      type: string
      enum: [staff.signed_in, staff.sign_in_failed, staff.sign_in_locked, staff.session_ended, access.refused, role.change_refused,
        role.created, role.updated, role.deleted, role.assigned, role.removed, account.lookup, account.lookup_rate_limited,
        account.viewed, account.jobs_viewed, grant.requested, grant.approved, grant.declined, grant.unanswered, grant.read,
