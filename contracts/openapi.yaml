      additionalProperties: false
    TestPlanner:
      type: object
      required: [time_limit_ms]
      properties:
        time_limit_ms: {type: integer, minimum: 1}
      additionalProperties: false
    TestSeed:
      type: object
      required: [at]
      properties:
        at: {$ref: '#/components/schemas/Instant', description: 'The story''s start clock: every seed record at or before
