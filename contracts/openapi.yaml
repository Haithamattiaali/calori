        only on the iPhone.'
    UnitStructure:
      type: string
      enum: [simple, composite, recipe]
      description: Unit structure (J72).
    UnitVersion:
      type: object
      description: An immutable Unit version (E44); the latest Saved version is used for new logs only.
      required: [unit_version_id, unit_id, version, nutrient_vector, evidence, created_at]
      properties:
        unit_version_id: {$ref: '#/components/schemas/UnitVersionId'}
        unit_id: {$ref: '#/components/schemas/UnitId'}
        version: {type: integer, minimum: 1}
        components:
          type: array
          items: {$ref: '#/components/schemas/UnitComponent'}
        accompaniment_rule_version: {type: string, description: The Food rule version applied (e.g. bread inside).}
        total_mass_g: {$ref: '#/components/schemas/ExactNumber'}
        measured_amount_g: {$ref: '#/components/schemas/ExactNumber'}
        sample_count: {type: integer, minimum: 1}
        nutrient_vector: {$ref: '#/components/schemas/NutrientVector', description: 'Per count, unrounded.'}
        evidence: {$ref: '#/components/schemas/Evidence', description: Weakest component's badge (J70).}
        value_basis: {$ref: '#/components/schemas/ValueBasis'}
        measurement_evidence_ids:
          type: array
          items: {type: string}
        source_analysis_id: {$ref: '#/components/schemas/AnalysisId'}
        created_at: {$ref: '#/components/schemas/Instant'}
    UnitVersionId:
      type: string
      description: 'One immutable Unit version: `uv_<…>_v<n>`.'
      pattern: ^uv_[a-z0-9_]+_v[0-9]+$
      examples: [uv_mona_cheese_bite_v1]
