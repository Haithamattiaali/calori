        measured_resting_kcal: {$ref: '#/components/schemas/ExactNumber'}
        maintenance_kcal_entered: {$ref: '#/components/schemas/ExactNumber'}
        planned_exercise_kcal: {$ref: '#/components/schemas/ExactNumber'}
        exercise_in_maintenance: {type: boolean}
        goal:
          type: string
          enum: [lose, maintain, gain]
        step_pct: {$ref: '#/components/schemas/Decimal'}
        entered_target_kcal: {$ref: '#/components/schemas/ExactNumber', description: 'An Entered or Clinician-provided Target
            (POLICY_FLOOR with `limit`, J100).'}
        source: {$ref: '#/components/schemas/TargetSource'}
        macro_split: {$ref: '#/components/schemas/MacroSplit'}
        macro_locks: {$ref: '#/components/schemas/MacroGrams'}
        glp1: {type: boolean}
      additionalProperties: false
    TargetInputSnapshot:
      type: object
      description: The unrounded computation kept with the Target (J102).
